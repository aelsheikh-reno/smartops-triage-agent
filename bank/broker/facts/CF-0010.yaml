id: CF-0010
name: approved_download_domains
description: 'The customer''s approved download hosts: the hosts the customer approved for tools to download from (named internal repositories, PKI/CRL endpoints, named vendor update hosts). Not every internal host (#27), and never a shared hosting or file-sharing domain whose content any tenant controls. Hosts, not tools, so the hash rule does not apply.'
fields:
- domain
- scope
- owner
match_rule: exact host, or a subdomain only where the entry says so; IP literals never match; being inside the internal networks (CF-0031) is not a match
collected_by: customer
supply_effort: low
supply_effort_reason: Static domain list.
example:
  domain: pki.corp.local
  scope: internal
  owner: PKI team
version: 3
