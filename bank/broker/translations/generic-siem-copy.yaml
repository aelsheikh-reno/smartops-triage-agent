# Vendor value table (recipe layer). Maps one product's raw alert values to the bank's alert classes
# (bank/broker/capabilities.yaml alert_classes). Rows are tried in order; the first match wins; no match gives the class default.
# match: {<raw property>: <value or list>} compares case-insensitively; {pattern: <regex>} searches the class's role values joined by a space.
# source: edr_api (the product's own API: authoritative for endpoint.run_status), siem_copy (the product's alert as copied into the SIEM: a fallback), or alert (values read from the normalized alert itself).
# Each row has an id and a kind: ambiguous (the value does not say what happened: always unknown, in every mode) or
# unverified (meaning from vendor docs, not confirmed at this customer: may support a close in Shadow and Recommend, marked
# 'unverified mapping: <table>/<row>', never in Auto). Verified is per customer, recorded in bank/broker/customers/<c>/verifications.yaml.
vendor: any
product: any (SIEM copy)
source: siem_copy
fallback: true
answers: endpoint.run_status
scope: generic
feed: 'Normalized run-status names any product''s alert may carry in the SIEM: a fallback only (unverified rows can only raise).'
references:
- bank parameters before the migration (av_*_pattern, usb_*_event_values, browser_user_agent_pattern, web_success_status_pattern)
- bank/intake/use_cases.yaml triage_hints
license: internal
classes:
  run_status:
    reads:
    - reporting_control.action_raw
    rows:
    - id: run_status.blocked_pre_execution
      match:
        value:
        - blocked_pre_execution
        - deleted_pre_execution
      value: pre_execution
      kind: unverified
    - id: run_status.quarantined_post_execution
      match:
        value:
        - quarantined_post_execution
        - cleaned_post_execution
        - pending_reboot
        - pending reboot
        - partially_remediated
        - partially remediated
        - remediation_failed
        - remediation failed
        - quarantined
        - cleaned
      value: unknown
      kind: ambiguous
      note: 'Post-execution or unfinished remediation: the bank refuses to judge, so it flags. Ambiguous: the value does not say whether the file ran, so it answers unknown in every mode and can never support
        a close.'
    - id: run_status.detected
      match:
        value:
        - detected
        - allowed
      value: ran
      kind: unverified
    default: unknown
