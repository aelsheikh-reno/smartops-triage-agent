# Vendor value table (recipe layer). Maps one product's raw alert values to the bank's alert classes
# (bank/broker/capabilities.yaml alert_classes). Rows are tried in order; the first match wins; no match gives the class default.
# match: {<raw property>: <value or list>} compares case-insensitively; {pattern: <regex>} searches the class's role values joined by a space.
# source: edr_api (the product's own API: authoritative for endpoint.run_status), siem_copy (the product's alert as copied into the SIEM: a fallback), or alert (values read from the normalized alert itself).
# Each row has an id and a kind: ambiguous (the value does not say what happened: always unknown, in every mode) or
# unverified (meaning from vendor docs, not confirmed at this customer: may support a close in Shadow and Recommend, marked
# 'unverified mapping: <table>/<row>', never in Auto). Verified is per customer, recorded in bank/broker/customers/<c>/verifications.yaml.
vendor: Microsoft
product: Defender for Endpoint
source: edr_api
answers: endpoint.run_status
feed: 'Defender API: alert evidence via the Graph security API (detectionStatus, remediationStatus), found by the vendor alert ID or a bounded device + file hash + time match. The evidence item read is
  the one for the alerted file, by SHA-256, never the first item (round 6, S7; #20)'
# Which evidence item and which property (round 6, S7). detectionStatus is a property of the file, process and registry
# evidence subtypes only; remediationStatus is on the base alertEvidence type, so every item has it. The broker picks the
# item whose hash is the alerted file's; a sibling item (another file in the same alert) is never read. None or several
# matching items answer unknown.
evidence:
  hash_paths:
    fileEvidence: [fileDetails.sha256]
    processEvidence: [imageFile.sha256]
  properties:
    detectionStatus: [fileEvidence, processEvidence, registryKeyEvidence, registryValueEvidence]
    remediationStatus: base
# Known-answer tests for this table, run by validate through the broker's run_status (a vendor alert with its evidence items,
# the alerted file's hash, the required answer).
known_answers:
- name: benign sibling prevented, alerted file detected
  sha256: aaaa000000000000000000000000000000000000000000000000000000000001
  alert:
    evidence:
    - {type: fileEvidence, fileDetails: {sha256: bbbb000000000000000000000000000000000000000000000000000000000002}, detectionStatus: prevented, remediationStatus: prevented}
    - {type: fileEvidence, fileDetails: {sha256: aaaa000000000000000000000000000000000000000000000000000000000001}, detectionStatus: detected, remediationStatus: none}
  expect: ran
- name: alerted file prevented
  sha256: aaaa000000000000000000000000000000000000000000000000000000000001
  alert:
    evidence:
    - {type: fileEvidence, fileDetails: {sha256: aaaa000000000000000000000000000000000000000000000000000000000001}, detectionStatus: prevented}
  expect: pre_execution
- name: alerted file as process evidence, blocked at run time
  sha256: aaaa000000000000000000000000000000000000000000000000000000000001
  alert:
    evidence:
    - {type: processEvidence, imageFile: {sha256: aaaa000000000000000000000000000000000000000000000000000000000001}, detectionStatus: blocked}
  expect: ran
- name: no evidence item for the alerted file
  sha256: aaaa000000000000000000000000000000000000000000000000000000000001
  alert:
    evidence:
    - {type: fileEvidence, fileDetails: {sha256: bbbb000000000000000000000000000000000000000000000000000000000002}, detectionStatus: prevented}
  expect: unknown
- name: detectionStatus on a base-type item (not a file, process or registry subtype) is not read
  sha256: aaaa000000000000000000000000000000000000000000000000000000000001
  alert:
    evidence:
    - {type: urlEvidence, fileDetails: {sha256: aaaa000000000000000000000000000000000000000000000000000000000001}, detectionStatus: prevented}
  expect: unknown
references:
- https://learn.microsoft.com/en-us/graph/api/resources/security-alertevidence?view=graph-rest-1.0
- docs/assumptions.md A4
license: public documentation, values only
classes:
  run_status:
    reads:
    - detectionStatus
    - remediationStatus
    rows:
    - id: run_status.detectionstatus_prevented
      match:
        detectionStatus: prevented
      value: pre_execution
      kind: unverified
      note: 'Microsoft: "The threat was prevented from occurring (running, downloading, and so on.)". Unverified until the lab test (#20) shows which property carries it per evidence type, and that it reaches
        the SIEM.'
    - id: run_status.remediationstatus_prevented
      match:
        remediationStatus: prevented
      value: pre_execution
      kind: unverified
      note: 'Microsoft: "The threat was prevented from executing".'
    - id: run_status.detectionstatus_blocked
      match:
        detectionStatus: blocked
      value: ran
      kind: unverified
      note: 'Microsoft: "The threat was remediated at run time." It ran, so it never closes as blocked before execution.'
    - id: run_status.remediationstatus_blocked
      match:
        remediationStatus: blocked
      value: ran
      kind: unverified
      note: 'Microsoft: "The threat was blocked while executing".'
    - id: run_status.detectionstatus_detected
      match:
        detectionStatus: detected
      value: ran
      kind: unverified
      note: 'Microsoft: "A product of the threat that executed was detected."'
    default: unknown
    default_note: 'Quarantine alone, or any other value, does not say whether the file ran: unknown, so it flags.'
