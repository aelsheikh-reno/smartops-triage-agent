# expect: accept or reject (with the reason the Triage agent logs).
pending:
- request_id: 7f3c1e0a-run:2:Q-0049:1
  run_id: 7f3c1e0a-run
  question_id: Q-0049
  scope_profile: triage
  deadline: '2026-10-17T10:00:10Z'
- request_id: ew-host42-1000:0:C-06:1
  entity_window_id: ew-host42-1000
  question_id: C-06
  scope_profile: triage
  deadline: '2026-10-17T10:00:10Z'
answers:
- name: answer to a pending triage request, in time
  expect: accept
  received_at: '2026-10-17T10:00:03Z'
  message: {request_id: 7f3c1e0a-run:2:Q-0049:1, run_id: 7f3c1e0a-run, measurement_id: m-901, answer: pre_execution, status: answered, trust: not_checked, provenance: {source: endpoint API, observed_at: '2026-10-17T10:00:02Z'}}
- name: context answer shared through the entity window
  expect: accept
  received_at: '2026-10-17T10:00:04Z'
  message: {request_id: ew-host42-1000:0:C-06:1, entity_window_id: ew-host42-1000, measurement_id: m-777, answer: false, status: answered, trust: checked, provenance: {source: context store, observed_at: '2026-10-17T09:59:00Z'}}
- name: answer for a run that did not send this request
  expect: reject
  reason: run_id does not match the pending request
  received_at: '2026-10-17T10:00:05Z'
  message: {request_id: 7f3c1e0a-run:2:Q-0049:1, run_id: 99999999-other, measurement_id: m-902, answer: pre_execution, status: answered, trust: checked, provenance: {source: endpoint API}}
- name: late answer
  expect: reject
  reason: late
  received_at: '2026-10-17T10:00:30Z'
  message: {request_id: 7f3c1e0a-run:2:Q-0049:1, run_id: 7f3c1e0a-run, measurement_id: m-903, answer: ran, status: answered, trust: checked, provenance: {source: endpoint API}}
- name: answer to no pending request
  expect: reject
  reason: no pending request
  received_at: '2026-10-17T10:00:05Z'
  message: {request_id: 7f3c1e0a-run:3:Q-0028:1, run_id: 7f3c1e0a-run, measurement_id: m-904, answer: low_risk, status: answered, trust: not_checked, provenance: {source: alert}}
# Request outcomes over time (contract/envelope.yaml deadline and defer_rule). validate runs each through the resolution
# rule; expect is the status the Triage agent records. defer_max_wait_seconds is 300 by default.
sequences:
- name: no answer by the deadline
  request: {request_id: 7f3c1e0a-run:4:Q-0028:1, run_id: 7f3c1e0a-run, question_id: Q-0028, scope_profile: triage, deadline: '2026-10-17T10:00:10Z'}
  events: []
  expect: source_unavailable
- name: deferred for rate limiting, answered inside the maximum wait
  request: {request_id: 7f3c1e0a-run:4:Q-0028:1, run_id: 7f3c1e0a-run, question_id: Q-0028, scope_profile: triage, deadline: '2026-10-17T10:00:10Z'}
  events:
  - {at: '2026-10-17T10:00:02Z', defer: {request_id: 7f3c1e0a-run:4:Q-0028:1, run_id: 7f3c1e0a-run, reason: rate_limited, retry_after_seconds: 30}}
  - {at: '2026-10-17T10:03:00Z', answer: {request_id: 7f3c1e0a-run:4:Q-0028:1, run_id: 7f3c1e0a-run, measurement_id: m-910, answer: low_risk, status: answered, trust: not_checked, provenance: {source: alert}}}
  expect: answered
- name: deferred for overload, waited past the maximum
  request: {request_id: 7f3c1e0a-run:4:Q-0028:1, run_id: 7f3c1e0a-run, question_id: Q-0028, scope_profile: triage, deadline: '2026-10-17T10:00:10Z'}
  events:
  - {at: '2026-10-17T10:00:02Z', defer: {request_id: 7f3c1e0a-run:4:Q-0028:1, run_id: 7f3c1e0a-run, reason: overload, retry_after_seconds: 60}}
  - {at: '2026-10-17T10:05:03Z', answer: {request_id: 7f3c1e0a-run:4:Q-0028:1, run_id: 7f3c1e0a-run, measurement_id: m-911, answer: low_risk, status: answered, trust: not_checked, provenance: {source: alert}}}
  expect: source_unavailable
- name: a second defer does not extend the maximum wait
  request: {request_id: 7f3c1e0a-run:4:Q-0028:1, run_id: 7f3c1e0a-run, question_id: Q-0028, scope_profile: triage, deadline: '2026-10-17T10:00:10Z'}
  events:
  - {at: '2026-10-17T10:00:02Z', defer: {request_id: 7f3c1e0a-run:4:Q-0028:1, run_id: 7f3c1e0a-run, reason: overload, retry_after_seconds: 60}}
  - {at: '2026-10-17T10:04:00Z', defer: {request_id: 7f3c1e0a-run:4:Q-0028:1, run_id: 7f3c1e0a-run, reason: overload, retry_after_seconds: 60}}
  - {at: '2026-10-17T10:06:00Z', answer: {request_id: 7f3c1e0a-run:4:Q-0028:1, run_id: 7f3c1e0a-run, measurement_id: m-912, answer: low_risk, status: answered, trust: not_checked, provenance: {source: alert}}}
  expect: source_unavailable
# Transport retries of one request_id (contract/envelope.yaml cache): what the broker served each time. expect: valid or the problem.
retries:
- name: retry after a completed measurement returns the same measurement
  served: [{status: answered, measurement_id: m-920}, {status: answered, measurement_id: m-920}]
  expect: valid
- name: retry after source_unavailable measures again
  served: [{status: source_unavailable, measurement_id: m-921}, {status: answered, measurement_id: m-922}]
  expect: valid
- name: a cached source_unavailable
  served: [{status: source_unavailable, measurement_id: m-923}, {status: source_unavailable, measurement_id: m-923}]
  expect: source_unavailable was cached
