# Designed: contract entries for questions and capabilities that are not in the bank yet (the next bank PR adds them).
# No flow may use them until they are; a guard_only context question may be read only by guards.
designed:
- id: privileged_session_match
  kind: capability
  status: designed
  note: the action came through the customer's privileged-access tool or jump host, with a matching privileged session (#24)
  answer:
    type: bool
