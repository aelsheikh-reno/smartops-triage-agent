id: escu:registry_keys_used_for_persistence
escu_uuid: f5f6af30-7aa7-4295-bfe9-07fe87c01a4b
name: Registry Keys Used For Persistence
techniques:
- T1547.001
data_source:
- Sysmon EventID 13
sigma_logsource:
- product: windows
  category: registry_set
sigma_refs:
- id: 20f0ee37-5942-4e45-b7d5-c5b5db9df5cd
  title: CurrentVersion Autorun Keys Modification
  relation: closest
required_roles:
- event
- host
- process
- registry
- user
intent: Detects writes to Run/RunOnce and other autostart registry keys on an endpoint from registry events.
fp_quality: good
explanations:
- BE-0002
- BE-0008
- BE-0018
- BE-0003
fingerprint:
- role:host.name
- role:registry.path
- role:registry.value_name
- role:registry.value_data
fingerprint_influence:
  role:host.name:
    rating: low
    reason: Host that reported the event.
  role:registry.path:
    rating: high
    reason: Key the attacker writes.
  role:registry.value_name:
    rating: high
    reason: Value name the attacker writes.
  role:registry.value_data:
    rating: high
    reason: Data the attacker writes.
precedent_entity: role:host.name
flow:
- step: 1
  question: Q-0000
  bind:
    entity: role:host.name
  attacker_influence:
    rating: low
    reason: An attacker cannot freely reproduce the fingerprint's host.
  on_yes: close:inherit:precedent_match
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0045
    then: flag
    rule:
      gte:
        param: alert_history_min_count
- step: 2
  question: Q-0013
  bind:
    entity: entity:process
  on_yes: close:benign_true_positive:sanctioned_management_tool
  on_no: next
  on_unknown: next
- step: 3
  question: Q-0019
  bind:
    entity: entity:process
  on_yes: close:benign_true_positive:trusted_signed_software
  on_no: next
  on_unknown: next
- step: 4
  question: Q-0004
  on_yes: close:benign_true_positive:approved_change
  on_no: next
  on_unknown: next
- step: 5
  question: Q-0018
  rule:
    gte:
      param: org_prevalence_min_hosts
  on_yes: flag
  on_no: escalate
  on_unknown: flag
source:
  repo: splunk/security_content
  path: detections/endpoint/registry_keys_used_for_persistence.yml
  title: Registry Keys Used For Persistence
license: Apache-2.0
status: draft
version: 7
notes: Command-line and registry-value baselines are attacker-chosen strings (attacker_influence high), so on their own they flag instead of closing.
parameters:
  precedent_validity_hours: 72
