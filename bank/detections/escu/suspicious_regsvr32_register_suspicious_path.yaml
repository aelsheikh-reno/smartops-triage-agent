intent: Detects regsvr32.exe registering a non-DLL file from AppData, ProgramData or Windows\Temp from process creation logs.
fp_quality: none
notes: 'fp_quality none: ESCU gives no benign cause. The tested cause (signed per-user installers) comes from analyst practice and needs review.'
enrichment:
