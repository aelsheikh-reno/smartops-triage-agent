required_alert_fields:
- _time
- dest
- parent_process_guid
- parent_process_path
- process
- process_hash
- user
intent: Detects sc.exe creating a service on a remote host (\\host create binpath=) from process creation logs.
fp_quality: good
explanations:
- BE-0002
- BE-0001
- BE-0007
- BE-0003
derived_fields:
  target_host:
    from: process
    pattern: \\\\([^\\\s]+)
    note: first UNC host in the command line
fingerprint:
- dest
- user
- process_hash
- target_host
fingerprint_influence:
  dest:
    rating: low
    reason: Host that reported the event.
  user:
    rating: low
    reason: Account recorded by the OS.
  process_hash:
    rating: low
    reason: Computed by the sensor; reproducing it means running the same binary.
  target_host:
    rating: high
    reason: Target named in an attacker-written command line.
precedent_entity: dest
precedent_validity: 72h
flow:
- step: 1
  question: Q-0000
  bind:
    entity: value:dest
  attacker_influence:
    rating: low
    reason: An attacker cannot freely reproduce dest, user, process_hash in the fingerprint.
  on_yes: close:inherit:precedent_match
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0045
    then: flag
- step: 2
  question: Q-0001
  on_yes: close:benign_true_positive:sanctioned_deployment_tool
  on_no: next
  on_unknown: next
- step: 3
  question: Q-0002
  on_yes: next
  on_no: escalate
  on_unknown: flag
- step: 4
  question: Q-0012
  on_yes: close:benign_true_positive:admin_activity_baselined
  on_no: next
  on_unknown: next
- step: 5
  question: Q-0004
  on_yes: close:benign_true_positive:approved_change
  on_no: escalate
  on_unknown: flag
