  on_yes: close:inherit:precedent_match
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0045
    then: flag
- step: 2
  question: Q-0025
  on_yes: close:benign_true_positive:approved_driver_exception
  on_no: next
  on_unknown: next
- step: 3
  question: Q-0024
  on_yes: escalate
  on_no: next
  on_unknown: next
- step: 4
  question: Q-0019
  on_yes: flag
  on_no: escalate
  on_unknown: flag
  bind:
    entity: file:ImagePath
