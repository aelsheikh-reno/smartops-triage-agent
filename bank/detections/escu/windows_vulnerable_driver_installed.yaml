  ImagePath:
    rating: high
    reason: Path the attacker can choose.
  driver_hash:
    rating: low
    reason: Computed by the sensor.
precedent_entity: dest
precedent_validity: 7d
flow:
- step: 1
  question: Q-0000
  bind:
    entity: value:dest
  attacker_influence:
