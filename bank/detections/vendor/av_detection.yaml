id: vendor:av_detection
name: Antivirus or EDR malware detection
family: vendor
use_case: UC-001
techniques:
- T1204.002
data_source:
- Any antivirus or EDR alert, normalized to the reporting_control and file roles (no data model required)
sigma_logsource:
- category: antivirus
sigma_refs:
- id: fa0c05b6-8ad3-468d-8231-c1cbccb64fba
  title: Antivirus - Hacktool Signature
  relation: closest
- id: 78cc2dd2-7d20-4d32-93ff-057084c38b93
  title: Antivirus - Password Dumper Signature
  relation: closest
- id: 4c6ca276-d4d0-4a8c-9e4c-d69832f8671f
  title: Antivirus - Ransomware Signature
  relation: closest
- id: 238527ad-3c2c-4e4f-a1f6-92fd63adb864
  title: Antivirus - Exploitation Framework Signature
  relation: closest
required_roles:
- host
- user
- reporting_control
- file
- event
intent: 'Generic: an antivirus or EDR product reports a malware detection on a host (normalized malware alert, any product).'
fp_quality: generic
notes: High-risk families escalate even when blocked. Only a block before execution can close, and only for low-risk classes; post-execution remediation, pending reboot and partial remediation flag. Test
  files flag. A block reported over forwarded syslog cannot close alone. Crown-jewel hosts flag through the permanent guardrail. Approved tooling and analysis hosts match on asset ID, never hostname. A
  sample from an analysis host seen on any other host in the window escalates; an approved tool's hash seen outside its approved hosts flags. A quarantined or unreadable file with no hash cannot close as
  approved tooling; the flow continues. The fingerprint uses the asset ID; without one it falls back to the hostname and the precedent is rated medium. Whether a file ran is read through the product's value
  table (bank/recipes/value_tables/), never from a data model. Capped at Recommend for each customer whose product rows in the value mapping are unverified.
explanations:
- BE-0019
- BE-0020
- BE-0030
- BE-0031
- BE-0037
fingerprint:
- role:host.asset_id
- role:reporting_control.signature
- role:file.sha256
precedent_entity: role:host.asset_id
fingerprint_influence:
  role:host.asset_id:
    rating: low
    reason: Device or agent ID assigned by the product; a host rename cannot change it.
    fallback:
      field: role:host.name
      rating: medium
      reason: Without an asset ID the hostname stands in, and a local administrator can rename a host.
  role:reporting_control.signature:
    rating: low
    reason: Detection name assigned by the product.
  role:file.sha256:
    rating: low
    reason: Hash of the file already judged; reproducing it reproduces that file.
precedent_entity_fallback: role:host.name
auto_requires:
- vendor_mapping_verified
flow:
- step: 1
  question: Q-0000
  bind:
    entity: role:host.asset_id
    current_action: role:reporting_control.action
  attacker_influence:
    rating: low
    reason: An attacker cannot freely reproduce the fingerprint's the asset ID.
    fallback_rating: medium
  on_yes: close:inherit:precedent_match
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0045
    then: flag
    rule:
      gte:
        param: alert_history_min_count
  - question: Q-0029
    then: escalate
    rule:
      'yes':
      - high_risk
      unknown:
      - unknown
- step: 2
  question: Q-0048
  on_yes: close:benign_true_positive:approved_security_tooling
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0073
    then: escalate
    if_entry_type:
    - analysis_host
    rule:
      gte:
        param: org_prevalence_escape_min_hosts
  - question: Q-0073
    then: flag
    if_entry_type:
    - tool
    rule:
      gte:
        param: org_prevalence_escape_min_hosts
- step: 3
  question: Q-0029
  rule:
    'yes':
    - high_risk
    unknown:
    - unknown
  on_yes: escalate
  on_no: next
  on_unknown: next
- step: 4
  question: Q-0049
  rule:
    'yes':
    - pre_execution
    unknown:
    - unknown
  on_yes: next
  on_no: escalate
  on_unknown: flag
- step: 5
  question: Q-0028
  rule:
    'yes':
    - low_risk
    unknown:
    - unknown
  on_yes: close:mitigated_true_positive:blocked_low_risk_detection
  on_no: flag
  on_unknown: flag
  guards:
  - question: Q-0046
    then: flag
    bind:
      key: role:host.name
    rule:
      gte:
        param: alert_history_min_count
  - question: Q-0030
    then: escalate
source:
  repo: internal
  path: bank/use_cases.yaml#UC-001
  title: Antivirus or EDR malware detection
