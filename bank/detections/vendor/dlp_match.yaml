id: vendor:dlp_match
name: DLP policy match
family: vendor
use_case: UC-010
techniques:
- T1048
- T1567
data_source:
- Splunk CIM Data Loss Prevention data model
sigma_logsource: []
sigma_logsource_none: Sigma has no log-source category for this alert type.
sigma_refs: []
required_alert_fields:
- src_user
- dest
- signature
- object
- action
- severity
- record_count
- object_hash
- _time
intent: 'Generic: a DLP control reports regulated data leaving through email, web, cloud storage or print (normalized DLP alert, any product).'
fp_quality: generic
notes: 'Held, quarantined and pending-release actions answer unknown and flag: a later release would undo them. High severity or a large record count flags even to approved destinations. Three or more DLP
  alerts for the same user in the window escalate. An unblocked match to an unapproved destination flags for an analyst.'
explanations:
- BE-0007
- BE-0019
- BE-0025
- BE-0026
- BE-0034
- BE-0037
derived_fields:
  recipient_domain:
    from: dest
    pattern: '@?([A-Za-z0-9.-]+\.[A-Za-z]{2,})$'
    note: domain of the destination address or URL
fingerprint:
- src_user
- signature
- recipient_domain
precedent_validity: 24h
precedent_entity: src_user
fingerprint_influence:
  src_user:
    rating: low
    reason: Authenticated sender account.
  signature:
    rating: low
    reason: Policy name assigned by the DLP control.
  recipient_domain:
    rating: high
    reason: Destination chosen by the sender.
flow:
- step: 1
  question: Q-0000
  bind:
    entity: value:src_user
    current_action: value:action
  attacker_influence:
    rating: low
    reason: An attacker cannot freely reproduce src_user, signature in the fingerprint.
  on_yes: close:inherit:precedent_match
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0045
    then: flag
  - question: Q-0063
    then: flag
  - question: Q-0064
    then: flag
  - question: Q-0046
    then: escalate
    bind:
      key: value:src_user
- step: 2
  question: Q-0061
  on_yes: close:false_positive:known_test_data
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0046
    then: escalate
    bind:
      key: value:src_user
- step: 3
  question: Q-0062
  on_yes: close:mitigated_true_positive:blocked_by_control
  on_no: next
  on_unknown: flag
  guards:
  - question: Q-0046
    then: escalate
    bind:
      key: value:src_user
- step: 4
  question: Q-0038
  on_yes: close:benign_true_positive:approved_business_exception
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0063
    then: flag
  - question: Q-0064
    then: flag
  - question: Q-0046
    then: escalate
    bind:
      key: value:src_user
- step: 5
  question: Q-0039
  on_yes: close:benign_true_positive:approved_recipient
  on_no: flag
  on_unknown: flag
  guards:
  - question: Q-0063
    then: flag
  - question: Q-0064
    then: flag
  - question: Q-0046
    then: escalate
    bind:
      key: value:src_user
source:
  repo: internal
  path: bank/use_cases.yaml#UC-010
  title: DLP policy match
license: internal
status: draft
version: 3
