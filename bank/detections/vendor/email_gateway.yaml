id: vendor:email_gateway
name: Email gateway threat alert
family: vendor
use_case: UC-008
techniques:
- T1566.001
- T1566.002
data_source:
- Splunk CIM Email data model
sigma_logsource: []
sigma_logsource_none: Sigma has no log-source category for this alert type.
sigma_refs: []
required_alert_fields:
- src_user
- recipient
- subject
- message_id
- url
- file_hash
- action
- _time
intent: 'Generic: an email security gateway reports a malicious or suspicious message, delivered or not (normalized email alert, any product).'
fp_quality: generic
explanations:
- BE-0019
- BE-0024
- BE-0030
fingerprint:
- src_user
- subject
- file_hash
precedent_validity: 24h
notes: Every fingerprint field is sender-chosen, so a precedent only flags. A block closes only when the message is out of every mailbox and no reputation source marks its URL or attachment. Delivered-then-removed
  closes only with no recorded click or open.
precedent_entity: recipient
fingerprint_influence:
  src_user:
    rating: high
    reason: Sender address set by the sender.
  subject:
    rating: high
    reason: Written by the sender.
  file_hash:
    rating: high
    reason: Attachment chosen by the sender.
flow:
- step: 1
  question: Q-0000
  bind:
    entity: value:recipient
    current_action: value:action
  attacker_influence:
    rating: high
    reason: Every fingerprint field is attacker-chosen, so a precedent only flags.
  on_yes: flag
  on_no: next
  on_unknown: next
- step: 2
  question: Q-0037
  on_yes: close:benign_true_positive:authorized_phishing_simulation
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0070
    when:
    - 'no'
    then: flag
- step: 3
  question: Q-0035
  on_yes: next
  on_no: flag
  on_unknown: flag
- step: 4
  question: Q-0027
  bind:
    values:
      param: email_blocked_action_values
  on_yes: close:mitigated_true_positive:blocked_by_control
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0034
    then: flag
  - question: Q-0030
    then: flag
- step: 5
  question: Q-0036
  on_yes: close:mitigated_true_positive:contained_without_interaction
  on_no: escalate
  on_unknown: flag
source:
  repo: internal
  path: bank/use_cases.yaml#UC-008
  title: Email gateway threat alert
license: internal
status: draft
version: 2
