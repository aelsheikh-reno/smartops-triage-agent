id: vendor:ids_alert
name: IDS or IPS signature alert
family: vendor
use_case: UC-002
techniques:
- T1190
- T1595
data_source:
- Splunk CIM Intrusion_Detection data model
sigma_logsource: []
sigma_logsource_none: Sigma has no log-source category for this alert type.
sigma_refs: []
required_roles:
- src
- dest
- reporting_control
- event
intent: 'Generic: a network IDS or IPS reports a signature match between a source and a target (normalized intrusion alert, any product).'
fp_quality: generic
explanations:
- BE-0019
- BE-0021
- BE-0022
- BE-0030
- BE-0032
- BE-0037
fingerprint:
- role:src.ip
- role:dest.ip
- role:reporting_control.signature_id
notes: Internal sources never close on blocked or patched (not applicable); tuned-signature and approved-scanner closes still apply to them. An approved scanner closes only while its scan job targets this
  destination; an approved tester only under a covering change or engagement record (unknown flags). Alert history applies to the blocked and not-applicable closes only. Exploit, intrusion and malware classes
  flag when blocked; only reconnaissance and policy classes close on a block. Signatures with no vulnerability mapping answer unknown at the vulnerability step and flag. Capped at Recommend for each customer
  whose IDS product rows in the value tables (signature class) are unverified.
precedent_entity: role:src.ip
fingerprint_influence:
  role:src.ip:
    rating: medium
    reason: Spoofable for single-packet signatures.
  role:dest.ip:
    rating: high
    reason: Target chosen by the initiator.
  role:reporting_control.signature_id:
    rating: high
    reason: Triggered by traffic the initiator crafts.
source:
  repo: internal
  path: bank/use_cases.yaml#UC-002
  title: IDS or IPS signature alert
license: internal
status: draft
version: 6
flow:
- step: 1
  question: Q-0000
  bind:
    entity: role:src.ip
    current_action: role:reporting_control.action
  attacker_influence:
    rating: medium
    reason: The least attacker-chosen fingerprint field (the source address) can still be forged; the close also needs a low-rated yes from a guard.
  on_yes: close:inherit:precedent_match
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0045
    then: flag
    rule:
      gte:
        param: alert_history_min_count
  - question: Q-0050
    then: flag
  - question: Q-0046
    then: flag
    bind:
      key: role:src.ip
    rule:
      gte:
        param: ids_history_min_count
  - question: Q-0053
    then: flag
    rule:
      'yes':
        param: ids_exploit_class_values
  - question: Q-0027
    when:
    - 'no'
    then: flag
    rule:
      'yes':
        param: blocked_action_values
- step: 2
  question: Q-0051
  on_yes: close:false_positive:tuned_signature
  on_no: next
  on_unknown: next
  guards: []
- step: 3
  question: Q-0031
  on_yes: close:benign_true_positive:approved_scanner_activity
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0052
    when:
    - 'no'
    then: flag
    if_entry_type:
    - scanner
  - question: Q-0055
    when:
    - 'no'
    then: flag
    if_entry_type:
    - tester
- step: 4
  question: Q-0027
  rule:
    'yes':
      param: blocked_action_values
  on_yes: close:mitigated_true_positive:blocked_by_control
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0053
    then: flag
    rule:
      'yes':
        param: ids_exploit_class_values
  - question: Q-0050
    then: flag
  - question: Q-0046
    then: flag
    bind:
      key: role:src.ip
    rule:
      gte:
        param: ids_history_min_count
  - question: Q-0032
    then: escalate
- step: 5
  question: Q-0033
  on_yes: close:mitigated_true_positive:signature_not_applicable
  on_no: escalate
  on_unknown: flag
  guards:
  - question: Q-0050
    then: flag
  - question: Q-0046
    then: flag
    bind:
      key: role:src.ip
    rule:
      gte:
        param: ids_history_min_count
  - question: Q-0032
    then: escalate
