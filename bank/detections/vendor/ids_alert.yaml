id: vendor:ids_alert
name: IDS or IPS signature alert
family: vendor
use_case: UC-002
techniques:
- T1190
- T1595
data_source:
- Splunk CIM Intrusion_Detection data model
sigma_logsource: []
sigma_logsource_none: Sigma has no log-source category for this alert type.
sigma_refs: []
required_alert_fields:
- src
- dest
- dest_port
- signature
- signature_id
- category
- severity
- action
- _time
intent: 'Generic: a network IDS or IPS reports a signature match between a source and a target (normalized intrusion alert, any product).'
fp_quality: generic
explanations:
- BE-0019
- BE-0021
- BE-0022
- BE-0030
- BE-0032
- BE-0037
fingerprint:
- src
- dest
- signature_id
precedent_validity: 24h
notes: Internal sources never close on blocked or patched (not applicable); tuned-signature and approved-scanner closes still apply to them. An approved scanner closes only while its scan job targets this
  destination; an approved tester only under a covering change or engagement record (unknown flags). Alert history applies to the blocked and not-applicable closes only. Exploit, intrusion and malware classes
  flag when blocked; only reconnaissance and policy classes close on a block. Signatures with no vulnerability mapping answer unknown at the vulnerability step and flag.
precedent_entity: src
fingerprint_influence:
  src:
    rating: medium
    reason: Spoofable for single-packet signatures.
  dest:
    rating: high
    reason: Target chosen by the initiator.
  signature_id:
    rating: high
    reason: Triggered by traffic the initiator crafts.
flow:
- step: 1
  question: Q-0000
  bind:
    entity: value:src
    current_action: value:action
  attacker_influence:
    rating: medium
    reason: The least attacker-chosen fingerprint field (src) can still be forged; the close also needs a low-rated yes from a guard.
  on_yes: close:inherit:precedent_match
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0045
    then: flag
  - question: Q-0050
    then: flag
  - question: Q-0046
    then: flag
    bind:
      key: value:src
      min_count:
        param: ids_history_min_count
  - question: Q-0053
    then: flag
  - question: Q-0027
    when:
    - 'no'
    then: flag
- step: 2
  question: Q-0051
  on_yes: close:false_positive:tuned_signature
  on_no: next
  on_unknown: next
  guards: []
- step: 3
  question: Q-0031
  on_yes: close:benign_true_positive:approved_scanner_activity
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0052
    when:
    - 'no'
    then: flag
    if_entry_type:
    - scanner
  - question: Q-0055
    when:
    - 'no'
    then: flag
    if_entry_type:
    - tester
- step: 4
  question: Q-0027
  on_yes: close:mitigated_true_positive:blocked_by_control
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0053
    then: flag
  - question: Q-0050
    then: flag
  - question: Q-0046
    then: flag
    bind:
      key: value:src
      min_count:
        param: ids_history_min_count
  - question: Q-0032
    then: escalate
- step: 5
  question: Q-0033
  on_yes: close:mitigated_true_positive:signature_not_applicable
  on_no: escalate
  on_unknown: flag
  guards:
  - question: Q-0050
    then: flag
  - question: Q-0046
    then: flag
    bind:
      key: value:src
      min_count:
        param: ids_history_min_count
  - question: Q-0032
    then: escalate
source:
  repo: internal
  path: bank/use_cases.yaml#UC-002
  title: IDS or IPS signature alert
license: internal
status: draft
version: 4
