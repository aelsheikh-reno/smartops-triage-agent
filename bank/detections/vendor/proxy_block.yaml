id: vendor:proxy_block
name: Web proxy or URL-filter block
family: vendor
use_case: UC-004
techniques:
- T1071.001
- T1189
data_source:
- Splunk CIM Web data model (proxy events)
sigma_logsource:
- category: proxy
sigma_refs: []
required_alert_fields:
- src
- user
- url
- dest
- category
- action
- http_user_agent
- _time
derived_fields:
  src_dest:
    from:
    - src
    - dest
    join: '|'
    note: source host plus domain, for alert.history
intent: 'Generic: a web proxy or URL filter blocks a request from a user or host (normalized web alert, any product).'
fp_quality: generic
notes: High-risk categories escalate even when blocked. A non-browser or empty user agent flags, and so do ten or more blocks from one host to one domain in the window (proxy_history_min_count) (repeat
  requests suggest a beacon). Uncategorised sites close only when the host visited them on at least 3 earlier days with a browser.
explanations:
- BE-0019
- BE-0027
- BE-0030
- BE-0036
- BE-0037
fingerprint:
- src
- dest
- category
precedent_validity: 24h
precedent_entity: src
fingerprint_influence:
  src:
    rating: low
    reason: Internal host address seen by the proxy.
  dest:
    rating: high
    reason: Domain chosen by whoever sends the request.
  category:
    rating: low
    reason: Assigned by the filtering service.
flow:
- step: 1
  question: Q-0000
  bind:
    entity: value:src
    current_action: value:action
  attacker_influence:
    rating: low
    reason: An attacker cannot freely reproduce src, category in the fingerprint.
  on_yes: close:inherit:precedent_match
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0045
    then: flag
    bind:
      min_count:
        param: proxy_history_min_count
  - question: Q-0057
    then: escalate
  - question: Q-0058
    when:
    - 'no'
    then: flag
- step: 2
  question: Q-0027
  on_yes: next
  on_no: escalate
  on_unknown: flag
- step: 3
  question: Q-0057
  on_yes: escalate
  on_no: next
  on_unknown: next
- step: 4
  question: Q-0041
  on_yes: close:mitigated_true_positive:blocked_low_risk_category
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0058
    when:
    - 'no'
    then: flag
  - question: Q-0046
    then: flag
    bind:
      key: value:src_dest
      min_count:
        param: proxy_history_min_count
  - question: Q-0034
    then: escalate
- step: 5
  question: Q-0060
  on_yes: close:benign_true_positive:established_uncategorized_site
  on_no: flag
  on_unknown: flag
  guards:
  - question: Q-0059
    then: flag
  - question: Q-0058
    when:
    - 'no'
    then: flag
  - question: Q-0046
    then: flag
    bind:
      key: value:src_dest
      min_count:
        param: proxy_history_min_count
  - question: Q-0034
    then: escalate
source:
  repo: internal
  path: bank/use_cases.yaml#UC-004
  title: Web proxy or URL-filter block
license: internal
status: draft
version: 3
