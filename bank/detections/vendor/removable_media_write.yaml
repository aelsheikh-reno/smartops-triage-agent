id: vendor:removable_media_write
name: Removable media file write (device control) alert
family: vendor
use_case: UC-016
techniques:
- T1052.001
- T1091
data_source:
- Normalized device-control alert (endpoint or DLP product)
sigma_logsource: []
sigma_logsource_none: Sigma has no log-source category for this alert type.
sigma_refs: []
required_alert_fields:
- dest
- user
- device_id
- device_class
- event_type
- action
- files_written
- _time
intent: 'Generic: an endpoint device-control or DLP product reports files written to removable storage (any product).'
fp_quality: generic
notes: Write events only. Blocked writes and approved exceptions close; more files than the customer's threshold flag even with an exception. Non-storage devices flag; servers and crown jewels escalate.
explanations:
- BE-0019
- BE-0025
- BE-0029
- BE-0037
fingerprint:
- dest
- user
- device_id
- event_type
precedent_validity: 7d
precedent_entity: dest
fingerprint_influence:
  dest:
    rating: low
    reason: Host that reported the event.
  user:
    rating: low
    reason: Account recorded by the OS.
  device_id:
    rating: high
    reason: Reported by the device; programmable devices can spoof it.
  event_type:
    rating: low
    reason: Recorded by the endpoint control.
flow:
- step: 1
  question: Q-0000
  bind:
    entity: value:dest
    current_action: value:action
  attacker_influence:
    rating: low
    reason: An attacker cannot freely reproduce dest, user, event_type in the fingerprint.
  on_yes: close:inherit:precedent_match
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0045
    then: flag
  - question: Q-0069
    when:
    - 'no'
    then: flag
  - question: Q-0066
    then: flag
  - question: Q-0067
    then: escalate
- step: 2
  question: Q-0066
  on_yes: flag
  on_no: next
  on_unknown: flag
- step: 3
  question: Q-0027
  on_yes: close:mitigated_true_positive:blocked_by_control
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0069
    when:
    - 'no'
    then: flag
  - question: Q-0067
    then: escalate
  - question: Q-0046
    then: flag
    bind:
      key: value:user
- step: 4
  question: Q-0043
  on_yes: close:benign_true_positive:approved_business_exception
  on_no: escalate
  on_unknown: flag
  guards:
  - question: Q-0069
    when:
    - 'no'
    then: flag
  - question: Q-0067
    then: escalate
  - question: Q-0068
    then: flag
source:
  repo: internal
  path: bank/use_cases.yaml#UC-016
  title: Removable media file write (device control) alert
license: internal
status: draft
version: 1
