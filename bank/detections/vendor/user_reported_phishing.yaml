id: vendor:user_reported_phishing
name: User-reported phishing email
family: vendor
use_case: UC-014
techniques:
- T1566
data_source:
- Splunk CIM Email data model (user-reported message)
sigma_logsource: []
sigma_logsource_none: Sigma has no log-source category for this alert type.
sigma_refs: []
derived_fields:
  message_url_domain:
    from: role:email.url
    pattern: https?://([^/\s:]+)
    note: domain of the first URL in the message; empty when there is none
  campaign_key:
    from:
    - role:email.sender_domain
    - derived:message_url_domain
    join: '|'
    note: 'secondary campaign key: sender domain plus URL domain, for alert.history'
required_roles:
- email
- user
- event
intent: 'Generic: a user reports an email as phishing through the report button or a reporting mailbox.'
fp_quality: generic
notes: The message id is sender-chosen, so a precedent never closes or flags by itself. Approved senders (customer-controlled or transactional-notification domains, with an aligned DMARC pass) are checked
  first; a remaining message with no URL and no attachment flags as possible business-email compromise. Simulation and approved-sender closes need an aligned DMARC pass. Repeat reports of one campaign (sender
  domain plus URL domain) flag.
explanations:
- BE-0023
- BE-0024
- BE-0030
- BE-0035
- BE-0037
fingerprint:
- role:email.message_id
precedent_entity: role:email.message_id
fingerprint_influence:
  role:email.message_id:
    rating: high
    reason: Set by the sending server.
flow:
- step: 1
  question: Q-0000
  bind:
    entity: role:email.message_id
  attacker_influence:
    rating: high
    reason: Every fingerprint field is attacker-chosen, so a precedent only flags.
  on_yes: next
  on_no: next
  on_unknown: next
- step: 2
  question: Q-0037
  on_yes: close:benign_true_positive:authorized_phishing_simulation
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0070
    when:
    - 'no'
    then: flag
- step: 3
  question: Q-0071
  on_yes: close:false_positive:false_report
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0070
    when:
    - 'no'
    then: flag
  - question: Q-0034
    then: escalate
    bind:
      entity: role:email.url
  - question: Q-0046
    then: flag
    bind:
      key: derived:campaign_key
    rule:
      gte: &id001
        param: alert_history_min_count
- step: 4
  question: Q-0072
  rule:
    lte: 0
  on_yes: flag
  on_no: next
  on_unknown: next
- step: 5
  question: Q-0036
  on_yes: close:mitigated_true_positive:contained_without_interaction
  on_no: escalate
  on_unknown: flag
  guards:
  - question: Q-0035
    when:
    - 'no'
    then: flag
  - question: Q-0046
    then: flag
    bind:
      key: derived:campaign_key
    rule:
      gte: *id001
source:
  repo: internal
  path: bank/use_cases.yaml#UC-014
  title: User-reported phishing email
license: internal
status: draft
version: 3
parameters:
  precedent_validity_hours: 72
