id: CF-0005
name: known_benign_lsass_accessors
description: Publicly documented benign binaries that open LSASS in user context, with expected install path and signer. Seeded by the bank; the customer can extend it.
fields: [tool_name, process_path_pattern, signer, sha256]
match_rule: sha256, or signer plus process_path_pattern. Never name or path alone.
collected_by: bank_seed
seed:   # signer strings are unverified; confirm against real signed binaries before approval
  - {tool_name: Sysinternals Process Explorer, process_path_pattern: '*\procexp64.exe', signer: Microsoft Corporation, verified: false}
  - {tool_name: Sysinternals Handle, process_path_pattern: '*\handle64.exe', signer: Microsoft Corporation, verified: false}
  - {tool_name: Visual Studio Code, process_path_pattern: '*\AppData\Local\Programs\Microsoft VS Code\Code.exe', signer: Microsoft Corporation, verified: false}
  - {tool_name: VMware Tools, process_path_pattern: 'C:\Program Files\VMware\VMware Tools\vmtoolsd.exe', signer: 'VMware, Inc.', verified: false}
  - {tool_name: Cisco Webex, process_path_pattern: '*\AppData\Local\WebEx\*', signer: Cisco WebEx LLC, verified: false}
  - {tool_name: Malwarebytes, process_path_pattern: 'C:\Program Files\Malwarebytes\Anti-Malware\*', signer: Malwarebytes Inc, verified: false}
  - {tool_name: Steam, process_path_pattern: '*\Steam\steamapps\*', signer: Valve Corp., verified: false}
source:
  - SigmaHQ/sigma rules/windows/process_access/proc_access_win_lsass_susp_access_flag.yml (filter_optional_* entries; paths only, signers added by us)
license: DRL-1.1   # facts derived from Sigma filters; attribution required
version: 2
