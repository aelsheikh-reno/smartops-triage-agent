id: CF-0006
name: sanctioned_remote_access_tools
description: Remote access and RMM tools the customer has approved, with expected install path, signer, and the processes that normally launch them.
fields: [tool_name, process_path, signer, sha256, expected_parents]
match_rule: sha256, or signer plus process_path. Never name or path alone. expected_parents entries use the same rule.
collected_by: customer   # can be seeded from ESCU remote_access_software lookup matches seen in the customer's data
example:
  tool_name: ScreenConnect
  process_path: 'C:\Program Files (x86)\ScreenConnect Client (*)\ScreenConnect.ClientService.exe'
  signer: ConnectWise LLC
  sha256: null
  expected_parents: [{process_path: 'C:\Windows\System32\services.exe', signer: Microsoft Windows}]
version: 2
