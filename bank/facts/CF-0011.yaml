id: CF-0011
name: sanctioned_backup_tools
description: Backup and snapshot software the customer runs (image backup agents, backup servers, the OS backup feature).
fields:
- tool_name
- install_path
- signer
- sha256
match_rule: sha256, or signer plus install_path. Never name or path alone.
collected_by: customer
supply_effort: medium
supply_effort_reason: Needs signer plus path for each backup tool.
example:
  tool_name: Example backup agent
  install_path: C:\Program Files\ExampleBackup\backup-service.exe
  signer: Example Backup Ltd
  sha256: null
version: 3
