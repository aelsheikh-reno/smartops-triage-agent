id: CF-0020
name: dlp_exceptions
description: 'Approved DLP business exceptions: who may send which data class to which destination, until when.'
fields:
- users_or_groups
- policy
- destinations
- ticket
- expires
match_rule: user in users_or_groups, policy matches, destination listed, not expired
collected_by: customer
example:
  users_or_groups:
  - CORP\TradeFinance
  policy: IBAN bulk
  destinations:
  - partnerbank.example
  ticket: RISK-0123
  expires: '2027-01-31'
version: 1
