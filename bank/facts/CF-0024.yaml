id: CF-0024
name: tuned_signatures
description: Signatures or WAF rules the customer accepts as noise for a specific source and destination (or application), with reason and expiry.
fields:
- signature_or_rule
- src
- dest_or_app
- reason
- ticket
- expires
match_rule: signature or rule equal, and src and dest (or application) within the listed values; never signature alone
collected_by: customer
supply_effort: medium
supply_effort_reason: Built up from tuning decisions; starts empty.
example:
  signature_or_rule: 1:2027865
  src: 10.20.0.15
  dest_or_app: 10.30.0.0/24
  reason: Monitoring probe matches a policy signature
  ticket: TUNE-0042
  expires: '2027-01-31'
version: 2
