id: CF-0026
name: approved_senders
description: Senders whose mail users often report by mistake, limited to customer-controlled domains and transactional-notification services (payroll, HR, IT notices). Partner domains are not eligible.
  Matched on authenticated domain.
fields:
- sender_domain
- sender_address
- sender_kind
- purpose
- owner
match_rule: From domain equals sender_domain (and address when given), sender_kind is customer_controlled or transactional_notification; only counts with an aligned DMARC pass
collected_by: customer
supply_effort: low
supply_effort_reason: Short list of sender domains.
example:
  sender_domain: notices.example-payroll.com
  sender_kind: transactional_notification
  purpose: Monthly payslip notices
  owner: HR
version: 3
