# Per-customer parameters with bank defaults. A customer overlay may override any of them.
parameters:
  org_prevalence_min_hosts: {default: 5, description: Minimum distinct hosts for org.prevalence to answer yes}
  org_prevalence_min_weeks: {default: 3, description: Minimum weeks (of the 4 before the alert window) with the pattern present}
  org_prevalence_of_weeks: {default: 4, description: Weeks examined before the alert window}
