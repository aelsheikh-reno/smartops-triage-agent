id: Q-0000
text: Was an alert with the same fingerprint closed by an original decision (an analyst or a non-precedent flow step) with a recorded reason within the validity window, with the precedent entity not a crown
  jewel and no other alert on it in the window (a mitigated precedent only when this alert was also blocked)?
tests: BE-0000
capability:
  name: case.precedent
  inputs:
    fingerprint: value:fingerprint
    entity: value:precedent_entity
attacker_influence:
  rating: low
  reason: Default only; each detection rates Q0 from its fingerprint fields (step-level attacker_influence).
needs:
  context:
  - CF-0007
notes: 'A closure with reason precedent_match is never itself a precedent; precedents cannot chain. In Shadow and Recommend the precedent is shown to the analyst instead of closing. Validity window is set
  per detection (precedent_validity).

  '
source:
