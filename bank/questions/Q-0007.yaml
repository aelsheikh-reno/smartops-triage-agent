id: Q-0007
text: Has this same binary (path and hash) opened LSASS on this host on at least 5 distinct days in the 30 days before the alert window?
tests: BE-0007
capability:
  name: entity.baseline
  inputs:
    entity: value:dest
    behavior: the binary of process:SourceProcessGUID opened LSASS
  params:
    min_days: 5
    lookback: 30d
attacker_influence:
  rating: low
  reason: Binary identity is OS-verified and the history ends before the alert window.
notes: "The \xB124h alert window is excluded so an intruder's repeated access during the incident cannot baseline itself."
source:
- elastic/detection-rules rules/windows/credential_access_lsass_openprocess_api.toml (first time seen, prior behavior)
