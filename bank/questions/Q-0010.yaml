id: Q-0010
text: Has this same binary (same hash, or same signer and path) run on this host on at least 3 distinct days in the 30 days before the alert window?
tests: BE-0007
capability:
  name: entity.baseline
  inputs:
    entity: value:dest
    behavior: the binary of process:process_guid ran
  params:
    min_days: 3
    lookback: 30d
attacker_influence:
  rating: low
  reason: Binary identity is OS-verified and the history ends before the alert window.
