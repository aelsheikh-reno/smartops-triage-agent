id: Q-0011
text: Is the binary that opened LSASS validly signed by a trusted publisher and not on the dump-capable exclusion list?
tests: BE-0007
capability:
  name: file.signer
  inputs:
    entity: process:SourceProcessGUID
    trusted_list: CF-0008
attacker_influence:
  rating: low
  reason: OS-verified code signature; dump-capable signed binaries are excluded.
needs:
  context:
  - CF-0008
notes: Gate on the baseline closure. Signer trust is not proof of benign intent; Microsoft-signed dump tools are excluded. CF-0008 seed signers are unverified until onboarding.
source:
