id: Q-0012
text: Has this user run the same normalized command line on any host on at least the customer's minimum number of distinct days in the lookback before the alert window?
tests: BE-0007
capability:
  name: entity.baseline
  inputs:
    entity: role:user.name
    behavior: ran the normalized command line role:process.command_line on any host
    lookback_days:
      param: entity_baseline_lookback_days
attacker_influence:
  rating: high
  reason: The command line is attacker-chosen; copying a routine one is enough.
source:
- splunk/security_content detections/endpoint/remote_process_instantiation_via_winrm_and_powershell.yml (limited set of hosts or users)
