id: Q-0014
text: Has the same normalized command line, with the same parent binary (hash or signer plus path), run on this host on at least 3 distinct days in the 30 days before the alert window?
tests: BE-0007
capability:
  name: entity.baseline
  inputs:
    entity: value:dest
    behavior: ran the normalized command line value:process from the binary of process:parent_process_guid
  params:
    min_days: 3
    lookback: 30d
attacker_influence:
  rating: high
  reason: The command line is attacker-chosen; a routine command can be replayed or its script tampered with.
