id: Q-0014
text: Has the same normalized command line, with the same parent binary (hash or signer plus path), run on this host on at least the customer's minimum number of distinct days in the lookback before the
  alert window?
tests: BE-0007
capability:
  name: entity.baseline
  inputs:
    entity: role:host.name
    behavior: ran the normalized command line role:process.command_line from the binary of entity:parent_process
    lookback_days:
      param: entity_baseline_lookback_days
attacker_influence:
  rating: high
  reason: The command line is attacker-chosen; a routine command can be replayed or its script tampered with.
source:
- splunk/security_content detections/endpoint/suspicious_scheduled_task_from_public_directory.yml (tuning to the environment)
