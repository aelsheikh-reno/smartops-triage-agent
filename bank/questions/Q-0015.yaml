id: Q-0015
text: Has the same normalized command line, from the same parent binary, run on at least the customer's minimum number of hosts in at least the customer's minimum number of the weeks examined before the
  alert window?
tests: BE-0008
capability:
  name: org.prevalence
  inputs:
    pattern: normalized command line role:process.command_line from the binary of entity:parent_process
    of_weeks:
      param: org_prevalence_of_weeks
    min_weeks:
      param: org_prevalence_min_weeks
attacker_influence:
  rating: high
  reason: The command line is attacker-chosen; a fleet-wide routine command can be reused or its script tampered with.
