id: Q-0015
text: Has the same normalized command line, from the same parent binary, run on at least the customer's minimum number of hosts (default 5), and in at least 3 of the 4 weeks before the alert window?
tests: BE-0008
capability:
  name: org.prevalence
  inputs:
    pattern: normalized command line value:process from the binary of process:parent_process_guid
  params:
    min_hosts:
      param: org_prevalence_min_hosts
    min_weeks:
      param: org_prevalence_min_weeks
    of_weeks:
      param: org_prevalence_of_weeks
