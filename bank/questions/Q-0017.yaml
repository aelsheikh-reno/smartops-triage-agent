id: Q-0017
text: Is every URL host in the command line an internal or approved download domain?
tests: BE-0010
capability:
  name: list.lookup
  inputs:
    list: CF-0010
    entity: value:url_hosts
attacker_influence:
  rating: low
  reason: The attacker chooses the URL but must host content on an approved domain; keep the list to customer-controlled domains.
