id: Q-0018
text: Has the same registry value name with the same normalized data been written on at least the customer's minimum number of hosts in every week of the lookback before the alert window?
tests: BE-0008
capability:
  name: org.prevalence
  inputs:
    pattern: registry value role:registry.path role:registry.value_name with normalized role:registry.value_data
    lookback_weeks:
      param: org_prevalence_lookback_weeks
attacker_influence:
  rating: high
  reason: Registry value name and data are attacker-chosen; copying a common autostart entry is enough.
source:
- splunk/security_content detections/endpoint/registry_keys_used_for_persistence.yml (many legitimate applications)
