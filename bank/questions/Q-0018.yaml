id: Q-0018
text: Has the same registry value name with the same normalized data been written on at least the customer's minimum number of hosts (default 5), and in at least 3 of the 4 weeks before the alert window?
tests: BE-0008
capability:
  name: org.prevalence
  inputs:
    pattern: registry value value:registry_path value:registry_value_name with normalized value:registry_value_data
  params:
    min_hosts:
      param: org_prevalence_min_hosts
    min_weeks:
      param: org_prevalence_min_weeks
    of_weeks:
      param: org_prevalence_of_weeks
attacker_influence:
  rating: high
  reason: Registry value name and data are attacker-chosen; copying a common autostart entry is enough.
source:
- splunk/security_content detections/endpoint/registry_keys_used_for_persistence.yml (many legitimate applications)
license:
- Apache-2.0
text_origin: original
legal_review: false
status: draft
version: 3
