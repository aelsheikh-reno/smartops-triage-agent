id: Q-0019
text: Is the subject binary validly signed by a trusted publisher and not on the excluded-binaries list?
tests: BE-0018
capability:
  name: file.signer
  inputs:
    entity: process:subject_guid
    trusted_list: CF-0008
attacker_influence:
  rating: low
  reason: OS-verified code signature; LOLBins, script hosts and dump tools are excluded.
needs:
  context:
  - CF-0008
notes: The entity is bound per detection (parent process, registry writer, loaded module, driver file). A trusted signature is evidence, not clearance. CF-0008 seed signers are unverified until onboarding.
