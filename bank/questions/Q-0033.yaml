id: Q-0033
text: Does recent vulnerability data show the target is not affected by the vulnerability this signature targets?
tests: BE-0022
capability:
  name: vuln.not_applicable
  inputs:
    host: role:dest.ip
    signature: role:reporting_control.signature
    max_age_days:
      param: vuln_data_max_age_days
attacker_influence:
  rating: low
  reason: Vulnerability data is collected independently of the attack; it can be stale or miss unmanaged software.
notes: Unknown when the signature maps to no vulnerability, or when no data newer than vuln_data_max_age exists.
