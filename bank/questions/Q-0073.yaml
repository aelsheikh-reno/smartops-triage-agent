id: Q-0073
text: Was the file's hash seen in the alert window on any host outside the approved security-tooling and analysis hosts?
tests: BE-0031
capability:
  name: org.prevalence
  inputs:
    pattern: file with hash value:file_hash
    window: alert_window
    exclude_list: CF-0023
  params:
    min_hosts: 1
attacker_influence:
  rating: low
  reason: Hash sightings across the fleet come from sensors; used only as a guard that escalates.
needs:
  context:
  - CF-0023
notes: 'Guard on the approved-tooling and analysis-host close: a sample that escaped the sandbox, or a tool running where it is not approved, escalates. A missing hash answers unknown and flags.'
