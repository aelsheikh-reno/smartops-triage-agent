# Vendor value table (recipe layer). Maps one product's raw alert values to the bank's alert classes
# (bank/capabilities.yaml alert_classes). Rows are tried in order; the first match wins; no match gives the class default.
# match: {<raw property>: <value or list>} compares case-insensitively; {pattern: <regex>} searches the class's role values joined by a space.
# May name products: it is recipe data, not bank logic, and never enters the runtime bundle. Each row is verified or not;
# a detection family whose classes have unverified rows for a customer's product is capped at Recommend for that customer.
# source: edr_api (the product's own API: authoritative for endpoint.run_status), siem_copy (the product's alert as copied into the
# SIEM: fallback only; an unverified fallback row can only raise), or alert (values read from the normalized alert itself).
vendor: any
product: any (SIEM copy)
source: siem_copy
fallback: true
answers: endpoint.run_status
scope: generic
feed: 'Normalized run-status names any product''s alert may carry in the SIEM: a fallback only (unverified rows can only raise).'
references:
- bank parameters before the migration (av_*_pattern, usb_*_event_values, browser_user_agent_pattern, web_success_status_pattern)
- bank/use_cases.yaml triage_hints
license: internal
classes:
  run_status:
    reads:
    - reporting_control.action_raw
    rows:
    - match:
        value:
        - blocked_pre_execution
        - deleted_pre_execution
      value: pre_execution
      verified: false
    - match:
        value:
        - quarantined_post_execution
        - cleaned_post_execution
        - pending_reboot
        - pending reboot
        - partially_remediated
        - partially remediated
        - remediation_failed
        - remediation failed
        - quarantined
        - cleaned
      value: unknown
      verified: false
      note: 'Post-execution or unfinished remediation: the bank refuses to judge, so it flags.'
    - match:
        value:
        - detected
        - allowed
      value: ran
      verified: false
    default: unknown
