  http_status_class:
    reads:
    - web.status
    rows:
    - match:
        pattern: ^2\d\d$
      value: success
      verified: true
      note: HTTP status classes (RFC 9110).
    - match:
        pattern: ^3\d\d$
      value: redirect
      verified: true
    - match:
        pattern: ^4\d\d$
      value: client_error
      verified: true
    - match:
        pattern: ^5\d\d$
      value: server_error
      verified: true
    default: other
  user_agent_class:
    reads:
    - web.user_agent
    rows:
    - match:
        pattern: ^Mozilla/5\.0 \(.+\) .*(Chrome|Firefox|Safari|Edg)/\d+
      value: browser
      verified: false
      note: Mainstream browser user agents; anything else (scripts, tools, empty) is other and flags.
    default: other
