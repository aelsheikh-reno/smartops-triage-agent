# Vendor value table (recipe layer). Maps one product's raw alert values to the bank's alert classes
# (bank/capabilities.yaml alert_classes). Rows are tried in order; the first match wins; no match gives the class default.
# match: {<raw property>: <value or list>} compares case-insensitively; {pattern: <regex>} searches the class's role values joined by a space.
# source: edr_api (the product's own API: authoritative for endpoint.run_status), siem_copy (the product's alert as copied into the SIEM: a fallback), or alert (values read from the normalized alert itself).
# Each row has an id and a kind: ambiguous (the value does not say what happened: always unknown, in every mode) or
# unverified (meaning from vendor docs, not confirmed at this customer: may support a close in Shadow and Recommend, marked
# 'unverified mapping: <table>/<row>', never in Auto). Verified is per customer, recorded in bank/overlays/customer/<c>/verifications.yaml.
vendor: Microsoft
product: Defender Antivirus
source: siem_copy
fallback: true
answers: endpoint.run_status
fallback_for: microsoft-defender-for-endpoint
feed: 'Windows event log, events 1116 (detection) and 1117 (action taken), Action Name. The SIEM''s copy of the endpoint''s events: a fallback, used only when the Defender API is unavailable or not granted.'
references:
- docs/normalization.md (previous mapping, checked against the replay dataset)
license: internal
classes:
  run_status:
    reads:
    - EventID
    - Action Name
    rows:
    - id: run_status.1116
      match:
        EventID: '1116'
      value: ran
      kind: unverified
      note: 'Detection only, no action yet: treated as executed, so it escalates as before.'
    - id: run_status.1117_quarantine
      match:
        EventID: '1117'
        Action Name:
        - Quarantine
        - Remove
        - Clean
      value: unknown
      kind: ambiguous
      note: 'The event does not say whether the file ran first, so these flag (seen in the replay dataset). Ambiguous: the value does not say whether the file ran, so it answers unknown in every mode and
        can never support a close.'
    - id: run_status.1117_block
      match:
        EventID: '1117'
        Action Name: Block
      value: unknown
      kind: ambiguous
      note: 'Changed in the bank migration: the event does not say whether the file was stopped before it ran (it was mapped to blocked before execution). Unknown until the lab test (#20); it flags. Ambiguous:
        the value does not say whether the file ran, so it answers unknown in every mode and can never support a close.'
    default: unknown
