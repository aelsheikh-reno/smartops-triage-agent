# Vendor value table (recipe layer). Maps one product's raw alert values to the bank's alert classes
# (bank/capabilities.yaml alert_classes). Rows are tried in order; the first match wins; no match gives the class default.
# match: {<raw property>: <value or list>} compares case-insensitively; {pattern: <regex>} searches the class's role values joined by a space.
# May name products: it is recipe data, not bank logic, and never enters the runtime bundle. Each row is verified or not;
# a detection family whose classes have unverified rows for a customer's product is capped at Recommend for that customer.
# source: edr_api (the product's own API: authoritative for endpoint.run_status), siem_copy (the product's alert as copied into the
# SIEM: fallback only; an unverified fallback row can only raise), or alert (values read from the normalized alert itself).
vendor: Microsoft
product: Defender for Endpoint
source: edr_api
answers: endpoint.run_status
feed: 'Defender API: alert evidence via the Graph security API (detectionStatus, remediationStatus), found by the vendor alert ID or a bounded device + file hash + time match'
references:
- https://learn.microsoft.com/en-us/graph/api/resources/security-alertevidence?view=graph-rest-1.0
- docs/assumptions.md A4
license: public documentation, values only
classes:
  run_status:
    reads:
    - detectionStatus
    - remediationStatus
    rows:
    - match:
        detectionStatus: prevented
      value: pre_execution
      verified: false
      note: 'Microsoft: "The threat was prevented from occurring (running, downloading, and so on.)". Unverified until the lab test (#20) shows which property carries it per evidence type, and that it reaches
        the SIEM.'
    - match:
        remediationStatus: prevented
      value: pre_execution
      verified: false
      note: 'Microsoft: "The threat was prevented from executing".'
    - match:
        detectionStatus: blocked
      value: ran
      verified: false
      note: 'Microsoft: "The threat was remediated at run time." It ran, so it never closes as blocked before execution.'
    - match:
        remediationStatus: blocked
      value: ran
      verified: false
      note: 'Microsoft: "The threat was blocked while executing".'
    - match:
        detectionStatus: detected
      value: ran
      verified: false
      note: 'Microsoft: "A product of the threat that executed was detected."'
    default: unknown
    default_note: 'Quarantine alone, or any other value, does not say whether the file ran: unknown, so it flags.'
