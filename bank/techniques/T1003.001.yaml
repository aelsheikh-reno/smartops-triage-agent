id: T1003.001
name: LSASS Memory
attack_version: '20.0'
template: cred_access
covers: Credential access
max_mode: recommend
assumed_alert_fields:
- dest
- user
- process
- process_name
- process_path
- process_hash
- process_guid
- parent_process_name
- parent_process_path
- parent_process_guid
- _time
fingerprint:
- dest
- user
- process_hash
- parent_process_name
fingerprint_influence:
  dest:
    rating: low
    reason: Host that reported the event.
  user:
    rating: low
    reason: Account recorded by the OS.
  process_hash:
    rating: low
    reason: Computed by the sensor; reproducing it means running the same binary.
  parent_process_name:
    rating: high
    reason: File name the attacker can choose.
precedent_entity: dest
precedent_validity: 24h
flow:
- step: 1
  question: Q-0000
  bind:
    entity: value:dest
  attacker_influence:
    rating: low
    reason: An attacker cannot freely reproduce dest, user, process_hash in the fingerprint.
  on_yes: close:inherit:precedent_match
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0045
    then: flag
- step: 2
  question: Q-0013
  on_yes: close:benign_true_positive:sanctioned_management_tool
  on_no: next
  on_unknown: next
  bind:
    entity: process:process_guid
- step: 3
  question: Q-0004
  on_yes: close:benign_true_positive:approved_change
  on_no: escalate
  on_unknown: flag
source: MITRE ATT&CK v20.0 (mitre-attack/attack-stix-data); flow assembled from the pilot rule-level flows
license: MITRE ATT&CK Terms of Use
status: draft
version: 3
