id: T1685.005
name: Clear Windows Event Logs
attack_version: '20.0'
required_roles:
- host
- user
- event
template: log_clear
covers: Event log clearing
max_mode: recommend
fingerprint:
- role:host.name
- role:user.name
fingerprint_influence:
  role:host.name:
    rating: low
    reason: Host that reported the event.
  role:user.name:
    rating: low
    reason: Account recorded by the OS.
precedent_entity: role:host.name
flow:
- step: 1
  question: Q-0000
  bind:
    entity: role:host.name
  attacker_influence:
    rating: low
    reason: An attacker cannot freely reproduce the fingerprint's host, user.
  on_yes: close:inherit:precedent_match
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0045
    then: flag
    rule:
      gte:
        param: alert_history_min_count
- step: 2
  question: Q-0023
  on_yes: close:benign_true_positive:host_rebuild
  on_no: next
  on_unknown: next
- step: 3
  question: Q-0004
  on_yes: close:benign_true_positive:approved_change
  on_no: escalate
  on_unknown: flag
source: MITRE ATT&CK v20.0 (mitre-attack/attack-stix-data); flow assembled from the pilot rule-level flows
license: MITRE ATT&CK Terms of Use
status: draft
version: 3
