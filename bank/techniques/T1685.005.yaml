id: T1685.005
name: Clear Windows Event Logs
attack_version: '20.0'
template: log_clear
covers: Event log clearing
max_mode: recommend
assumed_alert_fields:
- dest
- user
- _time
fingerprint:
- dest
- user
fingerprint_influence:
  dest:
    rating: low
    reason: Host that reported the event.
  user:
    rating: low
    reason: Account recorded by the OS.
precedent_entity: dest
precedent_validity: 24h
flow:
- step: 1
  question: Q-0000
  bind:
    entity: value:dest
  attacker_influence:
    rating: low
    reason: An attacker cannot freely reproduce dest, user in the fingerprint.
  on_yes: close:inherit:precedent_match
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0045
    then: flag
- step: 2
  question: Q-0023
  on_yes: close:benign_true_positive:host_rebuild
  on_no: next
  on_unknown: next
- step: 3
  question: Q-0004
  on_yes: close:benign_true_positive:approved_change
  on_no: escalate
  on_unknown: flag
