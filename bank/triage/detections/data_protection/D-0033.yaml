id: D-0033
name: DLP policy match
family: data_protection
alert_type: control
max_mode: recommend
max_mode_reason: No true-positive replay data for DLP alerts (round 6, §5.2).
auto_excluded_reason: no_tp_replay_data
techniques:
- T1048
- T1567
required_roles:
- user
- dest
- reporting_control
- dlp
- event
intent: 'Generic: a DLP control reports regulated data leaving through email, web, cloud storage or print (normalized DLP alert, any product).'
fp_quality: generic
notes: 'Held, quarantined and pending-release actions answer unknown and flag: a later release would undo them. High severity or a large record count flags even to approved destinations. Three or more DLP
  alerts for the same user in the window turn a benign close into a flag and a block into an escalation, and escalate an unblocked match to an unapproved destination (which otherwise flags).'
explanations:
- BE-0007
- BE-0019
- BE-0025
- BE-0026
- BE-0034
- BE-0037
derived_fields:
  destination_domain:
    from: role:dest.address
    pattern: '@?([A-Za-z0-9.-]+\.[A-Za-z]{2,})$'
    note: domain of the destination address or URL
fingerprint:
- role:user.name
- role:reporting_control.signature
- derived:destination_domain
precedent_entity: role:user.name
fingerprint_influence:
  role:user.name:
    rating: low
    reason: Authenticated sender account.
  role:reporting_control.signature:
    rating: low
    reason: Policy name assigned by the DLP control.
  derived:destination_domain:
    rating: high
    reason: Destination chosen by the sender.
flow:
- step: 1
  question: Q-0000
  bind:
    entity: role:user.name
    current_action: role:reporting_control.action
  attacker_influence:
    rating: low
    reason: An attacker cannot freely reproduce the fingerprint's acting account, signature.
  on_yes: close:inherit:precedent_match
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0045
    then: flag
    rule:
      gte:
        param: alert_history_min_count
  - question: Q-0063
    then: flag
    rule:
      'yes':
        param: dlp_high_severity_values
      unknown:
      - other
  - question: Q-0064
    then: flag
    rule:
      gte:
        param: dlp_record_count_flag
  - question: Q-0046
    then: flag
    bind:
      key: role:user.name
    rule:
      gte: &id001
        param: alert_history_min_count
- step: 2
  question: Q-0061
  on_yes: close:false_positive:known_test_data
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0046
    then: flag
    bind:
      key: role:user.name
    rule:
      gte: *id001
- step: 3
  question: Q-0062
  rule:
    'yes':
      param: dlp_final_block_values
    unknown:
      param: dlp_pending_values
  on_yes: close:mitigated_true_positive:blocked_by_control
  on_no: next
  on_unknown: flag
  guards:
  - question: Q-0046
    then: escalate
    bind:
      key: role:user.name
    rule:
      gte: *id001
- step: 4
  question: Q-0038
  on_yes: flag
  flag_suggests:
    on_yes:
      suggests: close:benign_true_positive:approved_business_exception
      reason: 'probable approved business exception; the exception names the user, so who-did-it is the only hard-to-fake evidence; verify the user sent this content'
  on_no: next
  on_unknown: next
- step: 5
  question: Q-0039
  on_yes: close:benign_true_positive:approved_recipient
  on_no: flag
  on_unknown: flag
  guards:
  - question: Q-0063
    then: flag
    rule:
      'yes':
        param: dlp_high_severity_values
      unknown:
      - other
  - question: Q-0064
    then: flag
    rule:
      gte:
        param: dlp_record_count_flag
  - question: Q-0046
    then: escalate
    bind:
      key: role:user.name
    applies_to:
    - close
    - flag
    rule:
      gte: *id001
status: draft
version: 6
derived_from:
  library: bank
  rule: vendor:dlp_match
  title: DLP policy match
  path: bank/intake/use_cases.yaml#UC-010
  repo: internal
  license: internal
