id: D-0001
name: Add or Set Antivirus Exclusion via MpPreference
family: endpoint
alert_type: analytic
max_mode: recommend
max_mode_reason: Adds an antivirus exclusion, which weakens a security control; a wrong close leaves the gap open (round 6, S5).
auto_excluded_reason: destructive_or_anti_forensic
techniques:
- T1685
required_roles:
- event
- host
- process
- user
intent: Detects Add-MpPreference or Set-MpPreference adding an antivirus, Controlled Folder Access or ASR exclusion from process creation logs.
fp_quality: vague
explanations:
- BE-0002
- BE-0012
- BE-0001
- BE-0003
derived_fields:
  av_exclusions:
    from: role:process.command_line
    pattern: -(?:Exclusion\w+|ControlledFolderAccessAllowedApplications|AttackSurfaceReductionOnlyExclusions)\s+(\S+)
    all: true
    note: every exclusion value in the command line
fingerprint:
- role:host.name
- role:process.command_line
fingerprint_influence:
  role:host.name:
    rating: low
    reason: Host that reported the event.
  role:process.command_line:
    rating: high
    reason: Command line the attacker writes.
precedent_entity: role:host.name
flow:
- step: 1
  question: Q-0000
  bind:
    entity: role:host.name
  attacker_influence:
    rating: low
    reason: An attacker cannot freely reproduce the fingerprint's host.
  on_yes: close:inherit:precedent_match
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0045
    then: flag
    rule:
      gte:
        param: alert_history_min_count
- step: 2
  question: Q-0001
  on_yes: close:benign_true_positive:sanctioned_deployment_tool
  on_no: next
  on_unknown: next
- step: 3
  question: Q-0022
  on_yes: close:benign_true_positive:approved_av_exclusion
  on_no: next
  on_unknown: next
- step: 4
  question: Q-0002
  on_yes: next
  on_no: escalate
  on_unknown: flag
- step: 5
  question: Q-0004
  on_yes: flag
  flag_suggests:
    on_yes:
      suggests: close:benign_true_positive:approved_change
      reason: 'probable approved change; who-did-it (the implementer on the change) is the only hard-to-fake evidence; verify the implementer'
  on_no: escalate
  on_unknown: flag
status: draft
version: 8
parameters:
  precedent_validity_hours: 72
derived_from:
  library: escu
  rule: escu:add_or_set_antivirus_exclusion
  title: Add or Set Windows Defender Exclusion
  path: detections/endpoint/add_or_set_windows_defender_exclusion.yml
  repo: splunk/security_content
  license: Apache-2.0
