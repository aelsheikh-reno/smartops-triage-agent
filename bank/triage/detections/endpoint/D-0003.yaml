id: D-0003
name: Creation of Shadow Copy
family: endpoint
alert_type: analytic
techniques:
- T1003.003
required_roles:
- event
- host
- process
- user
intent: Detects vssadmin or wmic creating a volume shadow copy from process creation logs.
fp_quality: vague
notes: 'The source rule maps this to T1003.003 (NTDS): shadow copies are used to copy ntds.dit. On domain controllers the crown-jewel guardrail blocks auto-close.'
explanations:
- BE-0011
- BE-0007
- BE-0001
- BE-0003
fingerprint:
- role:host.name
- role:process.parent_name
- role:process.sha256
fingerprint_influence:
  role:host.name:
    rating: low
    reason: Host that reported the event.
  role:process.parent_name:
    rating: high
    reason: File name the attacker can choose.
  role:process.sha256:
    rating: low
    reason: Computed by the sensor; reproducing it means running the same binary.
precedent_entity: role:host.name
flow:
- step: 1
  question: Q-0000
  bind:
    entity: role:host.name
  attacker_influence:
    rating: low
    reason: An attacker cannot freely reproduce the fingerprint's host, process hash.
  on_yes: close:inherit:precedent_match
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0045
    then: flag
    rule:
      gte:
        param: alert_history_min_count
  - question: Q-0014
    when: ['no']
    then: flag
    rule: {gte: {param: entity_baseline_min_days}}
- step: 2
  question: Q-0021
  on_yes: close:benign_true_positive:sanctioned_backup_tool
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0014
    when: ['no']
    then: flag
    rule: {gte: {param: entity_baseline_min_days}}
- step: 3
  question: Q-0002
  on_yes: next
  on_no: escalate
  on_unknown: flag
- step: 4
  question: Q-0014
  rule:
    gte:
      param: entity_baseline_min_days
  on_yes: flag
  on_no: next
  on_unknown: next
  note: 'Was close:benign_true_positive:activity_baselined_on_host. Its only none/low yes was identity group membership (Q-0002) plus a baseline rated high, so it flags: group membership is never the only
    low-rated answer on a close path.'
- step: 5
  question: Q-0004
  on_yes: flag
  flag_suggests:
    on_yes:
      suggests: close:benign_true_positive:approved_change
      reason: 'probable approved change; who-did-it (the implementer on the change) is the only hard-to-fake evidence; verify the implementer'
  on_no: escalate
  on_unknown: flag
status: draft
version: 10
parameters:
  precedent_validity_hours: 72
derived_from:
  library: escu
  rule: escu:creation_of_shadow_copy
  title: Creation of Shadow Copy
  path: detections/endpoint/creation_of_shadow_copy.yml
  repo: splunk/security_content
  license: Apache-2.0
