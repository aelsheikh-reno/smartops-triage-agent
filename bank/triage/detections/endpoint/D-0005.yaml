id: D-0005
name: Detect MSHTA Url in Command Line
family: endpoint
alert_type: analytic
techniques:
- T1218.005
required_roles:
- event
- host
- process
intent: Detects mshta.exe with an http(s) URL in the command line from process creation logs.
fp_quality: vague
explanations:
- BE-0010
- BE-0007
- BE-0008
derived_fields:
  url_host:
    from: role:process.command_line
    pattern: https?://([^/\s:\"']+)
    note: first URL host in the command line
  url_hosts:
    from: role:process.command_line
    pattern: https?://([^/\s:\"')]+)
    all: true
    note: every URL host in the command line
fingerprint:
- role:host.name
- role:process.parent_name
- derived:url_host
fingerprint_influence:
  role:host.name:
    rating: low
    reason: Host that reported the event.
  role:process.parent_name:
    rating: high
    reason: File name the attacker can choose.
  derived:url_host:
    rating: high
    reason: Host in an attacker-written command line.
precedent_entity: role:host.name
flow:
- step: 1
  question: Q-0000
  bind:
    entity: role:host.name
  attacker_influence:
    rating: low
    reason: An attacker cannot freely reproduce the fingerprint's host.
  on_yes: close:inherit:precedent_match
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0045
    then: flag
    rule:
      gte:
        param: alert_history_min_count
- step: 2
  question: Q-0017
  on_yes: next
  on_no: escalate
  on_unknown: flag
- step: 3
  question: Q-0014
  rule:
    gte:
      param: entity_baseline_min_days
  on_yes: close:benign_true_positive:activity_baselined_on_host
  on_no: next
  on_unknown: next
- step: 4
  question: Q-0015
  rule:
    gte:
      param: org_prevalence_min_hosts
  on_yes: close:benign_true_positive:prevalent_in_org
  on_no: escalate
  on_unknown: flag
status: draft
version: 6
parameters:
  precedent_validity_hours: 72
derived_from:
  library: escu
  rule: escu:detect_mshta_url_in_command_line
  title: Detect MSHTA Url in Command Line
  path: detections/endpoint/detect_mshta_url_in_command_line.yml
