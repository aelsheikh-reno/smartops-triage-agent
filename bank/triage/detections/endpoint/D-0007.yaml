id: D-0007
name: Detect Remote Access Software Usage Process
family: endpoint
alert_type: analytic
techniques:
- T1219
required_roles:
- host
- user
- process
- event
intent: Detects execution of a known remote access tool (the source rule's remote-access tool list) on an endpoint from process creation logs.
fp_quality: good
explanations:
- BE-0006
- BE-0007
- BE-0003
fingerprint:
- role:host.name
- role:process.name
- role:process.sha256
fingerprint_influence:
  role:host.name:
    rating: low
    reason: Host that reported the event.
  role:process.name:
    rating: high
    reason: File name the attacker can choose.
  role:process.sha256:
    rating: low
    reason: Computed by the sensor; reproducing it means running the same binary.
precedent_entity: role:host.name
flow:
- step: 1
  question: Q-0000
  bind:
    entity: role:host.name
  attacker_influence:
    rating: low
    reason: An attacker cannot freely reproduce the fingerprint's host, process hash.
  on_yes: close:inherit:precedent_match
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0045
    then: flag
    rule:
      gte:
        param: alert_history_min_count
- step: 2
  question: Q-0008
  on_yes: next
  on_no: escalate
  on_unknown: flag
- step: 3
  question: Q-0009
  on_yes: next
  on_no: escalate
  on_unknown: next
- step: 4
  question: Q-0010
  rule:
    gte:
      param: entity_baseline_min_days
  on_yes: close:benign_true_positive:sanctioned_rmm_baselined
  on_no: next
  on_unknown: next
- step: 5
  question: Q-0004
  on_yes: close:benign_true_positive:approved_change
  on_no: escalate
  on_unknown: flag
status: draft
version: 7
parameters:
  precedent_validity_hours: 72
derived_from:
  library: escu
  rule: escu:detect_remote_access_software_usage_process
  title: Detect Remote Access Software Usage Process
  path: detections/endpoint/detect_remote_access_software_usage_process.yml
