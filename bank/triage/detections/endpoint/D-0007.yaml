id: D-0007
name: Detect Remote Access Software Usage Process
family: endpoint
alert_type: analytic
techniques:
- T1219
required_roles:
- host
- user
- process
- event
intent: Detects execution of a known remote access tool (the source rule's remote-access tool list) on an endpoint from process creation logs.
fp_quality: good
explanations:
- BE-0006
- BE-0007
- BE-0003
q0_off_reason: 'A session through the customer''s own remote-access tool by a stolen account is the same process event as the benign sessions humans closed (aimed case, round 9).'
fingerprint:
- role:host.name
- role:process.name
- role:process.sha256
fingerprint_influence:
  role:host.name:
    rating: low
    reason: Host that reported the event.
  role:process.name:
    rating: high
    reason: File name the attacker can choose.
  role:process.sha256:
    rating: low
    reason: Computed by the sensor; reproducing it means running the same binary.
precedent_entity: role:host.name
flow:
- step: 1
  question: Q-0000
  bind:
    entity: role:host.name
  attacker_influence:
    rating: low
    reason: An attacker cannot freely reproduce the fingerprint's host, process hash.
  on_yes: next
  on_no: next
  on_unknown: next
- step: 2
  question: Q-0008
  on_yes: next
  on_no: escalate
  on_unknown: flag
- step: 3
  question: Q-0009
  on_yes: next
  on_no: escalate
  on_unknown: next
- step: 4
  question: Q-0010
  rule:
    gte:
      param: entity_baseline_min_days
  on_yes: flag
  flag_suggests:
    on_yes:
      suggests: close:benign_true_positive:sanctioned_rmm_baselined
      reason: 'probable sanctioned remote-access use; a session by a stolen remote-access account is the same process event; verify who held the session'
  on_no: next
  on_unknown: next
- step: 5
  question: Q-0004
  on_yes: flag
  flag_suggests:
    on_yes:
      suggests: close:benign_true_positive:approved_change
      reason: 'probable approved change; who-did-it is the only hard-to-fake evidence and the remote-access process event is the same for an attacker session; verify the implementer and the session'
  on_no: escalate
  on_unknown: flag
status: draft
version: 8
parameters:
  precedent_validity_hours: 72
derived_from:
  library: escu
  rule: escu:detect_remote_access_software_usage_process
  title: Detect Remote Access Software Usage Process
  path: detections/endpoint/detect_remote_access_software_usage_process.yml
  repo: splunk/security_content
  license: Apache-2.0
