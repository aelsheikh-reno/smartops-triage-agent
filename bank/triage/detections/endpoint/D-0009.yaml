id: D-0009
name: Malicious PowerShell Process - Execution Policy Bypass
family: endpoint
alert_type: analytic
techniques:
- T1059.001
required_roles:
- event
- host
- process
intent: Detects PowerShell started with -ExecutionPolicy Bypass from process creation logs.
fp_quality: vague
explanations:
- BE-0002
- BE-0007
- BE-0008
q0_off_reason: 'The fingerprint is the whole command line, so a precedent can only be reused by tampering with the script it runs, which no question here sees (aimed case, round 9).'
fingerprint:
- role:host.name
- role:process.parent_name
- role:process.command_line
fingerprint_influence:
  role:host.name:
    rating: low
    reason: Host that reported the event.
  role:process.parent_name:
    rating: high
    reason: File name the attacker can choose.
  role:process.command_line:
    rating: high
    reason: Command line the attacker writes.
precedent_entity: role:host.name
flow:
- step: 1
  question: Q-0000
  bind:
    entity: role:host.name
  attacker_influence:
    rating: low
    reason: An attacker cannot freely reproduce the fingerprint's host.
  on_yes: next
  on_no: next
  on_unknown: next
- step: 2
  question: Q-0001
  on_yes: close:benign_true_positive:sanctioned_deployment_tool
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0014
    when: ['no']
    then: flag
    rule: {gte: {param: entity_baseline_min_days}}
  - question: Q-0045
    then: flag
    rule: {gte: {param: alert_history_min_count}}
- step: 3
  question: Q-0019
  bind:
    entity: entity:parent_process
  on_yes: next
  on_no: flag
  on_unknown: flag
- step: 4
  question: Q-0014
  rule:
    gte:
      param: entity_baseline_min_days
  on_yes: flag
  flag_suggests:
    on_yes:
      suggests: close:benign_true_positive:activity_baselined_on_host
      reason: 'probable routine script; persistence through a signed parent builds the same host baseline in days; verify the script content and how the job was created'
  on_no: next
  on_unknown: next
- step: 5
  question: Q-0015
  rule:
    gte:
      param: org_prevalence_min_hosts
  on_yes: flag
  flag_suggests:
    on_yes:
      suggests: close:benign_true_positive:prevalent_in_org
      reason: 'probable fleet-wide script; fleet persistence or a tampered shared script gives the same prevalence; verify the script content'
  on_no: escalate
  on_unknown: flag
status: draft
version: 8
parameters:
  precedent_validity_hours: 72
derived_from:
  library: escu
  rule: escu:malicious_powershell_process___execution_policy_bypass
  title: Malicious PowerShell Process - Execution Policy Bypass
  path: detections/endpoint/malicious_powershell_process___execution_policy_bypass.yml
