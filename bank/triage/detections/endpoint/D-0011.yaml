id: D-0011
name: Registry Keys Used For Persistence
family: endpoint
alert_type: analytic
techniques:
- T1547.001
required_roles:
- event
- host
- process
- registry
- user
intent: Detects writes to Run/RunOnce and other autostart registry keys on an endpoint from registry events.
fp_quality: good
explanations:
- BE-0002
- BE-0008
- BE-0018
- BE-0003
q0_off_reason: 'The fingerprint is the exact registry value, so a precedent can only be reused by replacing the program it points to, which no question here sees (aimed case, round 9).'
fingerprint:
- role:host.name
- role:registry.path
- role:registry.value_name
- role:registry.value_data
fingerprint_influence:
  role:host.name:
    rating: low
    reason: Host that reported the event.
  role:registry.path:
    rating: high
    reason: Key the attacker writes.
  role:registry.value_name:
    rating: high
    reason: Value name the attacker writes.
  role:registry.value_data:
    rating: high
    reason: Data the attacker writes.
precedent_entity: role:host.name
flow:
- step: 1
  question: Q-0000
  bind:
    entity: role:host.name
  attacker_influence:
    rating: low
    reason: An attacker cannot freely reproduce the fingerprint's host.
  on_yes: next
  on_no: next
  on_unknown: next
- step: 2
  question: Q-0013
  bind:
    entity: entity:process
  on_yes: close:benign_true_positive:sanctioned_management_tool
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0018
    when: ['no']
    then: flag
    rule: {gte: {param: org_prevalence_min_hosts}}
  - question: Q-0045
    then: flag
    rule: {gte: {param: alert_history_min_count}}
- step: 3
  question: Q-0019
  bind:
    entity: entity:process
  on_yes: close:benign_true_positive:trusted_signed_software
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0018
    when: ['no']
    then: flag
    rule: {gte: {param: org_prevalence_min_hosts}}
  - question: Q-0045
    then: flag
    rule: {gte: {param: alert_history_min_count}}
- step: 4
  question: Q-0004
  on_yes: flag
  flag_suggests:
    on_yes:
      suggests: close:benign_true_positive:approved_change
      reason: 'probable approved change; who-did-it (the implementer on the change) is the only hard-to-fake evidence; verify the implementer'
  on_no: next
  on_unknown: next
- step: 5
  question: Q-0018
  rule:
    gte:
      param: org_prevalence_min_hosts
  on_yes: flag
  on_no: escalate
  on_unknown: flag
status: draft
version: 9
notes: Command-line and registry-value baselines are attacker-chosen strings (attacker_influence high), so on their own they flag instead of closing.
parameters:
  precedent_validity_hours: 72
derived_from:
  library: escu
  rule: escu:registry_keys_used_for_persistence
  title: Registry Keys Used For Persistence
  path: detections/endpoint/registry_keys_used_for_persistence.yml
  repo: splunk/security_content
  license: Apache-2.0
