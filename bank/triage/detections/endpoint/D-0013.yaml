id: D-0013
name: Suspicious Regsvr32 Register Suspicious Path
family: endpoint
alert_type: analytic
techniques:
- T1218.010
required_roles:
- event
- host
- process
- user
intent: Detects regsvr32.exe registering a non-DLL file from AppData, ProgramData or Windows\Temp from process creation logs.
fp_quality: none
notes: 'fp_quality none: The source rule gives no benign cause. The tested cause (signed per-user installers) comes from analyst practice and needs review. The registered file is resolved as entity:module;
  without module identity from the server the gate answers unknown and the alert flags.'
explanations:
- BE-0018
- BE-0008
- BE-0003
q0_off_reason: 'The fingerprint is the whole command line, so a precedent can only be reused by replacing the registered module, which no question here sees (aimed case, round 9).'
fingerprint:
- role:host.name
- role:process.command_line
fingerprint_influence:
  role:host.name:
    rating: low
    reason: Host that reported the event.
  role:process.command_line:
    rating: high
    reason: Command line the attacker writes.
precedent_entity: role:host.name
flow:
- step: 1
  question: Q-0000
  bind:
    entity: role:host.name
  attacker_influence:
    rating: low
    reason: An attacker cannot freely reproduce the fingerprint's host.
  on_yes: next
  on_no: next
  on_unknown: next
- step: 2
  question: Q-0019
  bind:
    entity: entity:module
  on_yes: next
  on_no: escalate
  on_unknown: flag
- step: 3
  question: Q-0015
  rule:
    gte:
      param: org_prevalence_min_hosts
  on_yes: flag
  flag_suggests:
    on_yes:
      suggests: close:benign_true_positive:prevalent_in_org
      reason: 'probable fleet-wide registration of a signed module; fleet persistence or a sideloaded signed module looks the same; verify the module and its path'
  on_no: next
  on_unknown: next
- step: 4
  question: Q-0004
  on_yes: flag
  flag_suggests:
    on_yes:
      suggests: close:benign_true_positive:approved_change
      reason: 'probable approved change; who-did-it is the only hard-to-fake evidence besides a signer an attacker can borrow; verify the implementer and the module'
  on_no: escalate
  on_unknown: flag
status: draft
version: 7
parameters:
  precedent_validity_hours: 72
derived_from:
  library: escu
  rule: escu:suspicious_regsvr32_register_suspicious_path
  title: Suspicious Regsvr32 Register Suspicious Path
