id: D-0014
name: Suspicious Rundll32 no Command Line Arguments
family: endpoint
alert_type: analytic
techniques:
- T1218.011
required_roles:
- event
- host
- process
intent: Detects rundll32.exe running with no arguments (typical injection target) from process creation logs.
fp_quality: vague
explanations:
- BE-0018
- BE-0007
- BE-0008
q0_off_reason: 'Code injected into the precedent''s parent spawns the same rundll32 from the same path, which no question here sees (aimed case, round 9).'
fingerprint:
- role:host.name
- role:process.parent_name
- role:process.path
fingerprint_influence:
  role:host.name:
    rating: low
    reason: Host that reported the event.
  role:process.parent_name:
    rating: high
    reason: File name the attacker can choose.
  role:process.path:
    rating: high
    reason: Path the attacker can choose.
precedent_entity: role:host.name
flow:
- step: 1
  question: Q-0000
  bind:
    entity: role:host.name
  attacker_influence:
    rating: low
    reason: An attacker cannot freely reproduce the fingerprint's host.
  on_yes: next
  on_no: next
  on_unknown: next
- step: 2
  question: Q-0019
  bind:
    entity: entity:parent_process
  on_yes: next
  on_no: escalate
  on_unknown: flag
- step: 3
  question: Q-0014
  rule:
    gte:
      param: entity_baseline_min_days
  on_yes: flag
  flag_suggests:
    on_yes:
      suggests: close:benign_true_positive:activity_baselined_on_host
      reason: 'probable routine rundll32 from a signed parent; code injected into that parent spawns the same command; verify the parent process and what rundll32 loaded'
  on_no: next
  on_unknown: next
- step: 4
  question: Q-0015
  rule:
    gte:
      param: org_prevalence_min_hosts
  on_yes: flag
  flag_suggests:
    on_yes:
      suggests: close:benign_true_positive:prevalent_in_org
      reason: 'probable fleet-wide rundll32 from a signed parent; code injected into that parent spawns the same command; verify the parent process and what rundll32 loaded'
  on_no: escalate
  on_unknown: flag
status: draft
version: 7
parameters:
  precedent_validity_hours: 72
