    then: flag
    rule:
      gte:
        param: alert_history_min_count
- step: 2
  question: Q-0019
  bind:
    entity: entity:parent_process
  on_yes: next
  on_no: escalate
  on_unknown: flag
- step: 3
  question: Q-0014
  rule:
    gte:
      param: entity_baseline_min_days
  on_yes: close:benign_true_positive:activity_baselined_on_host
  on_no: next
  on_unknown: next
- step: 4
  question: Q-0015
  rule:
    gte:
      param: org_prevalence_min_hosts
  on_yes: close:benign_true_positive:prevalent_in_org
  on_no: escalate
  on_unknown: flag
