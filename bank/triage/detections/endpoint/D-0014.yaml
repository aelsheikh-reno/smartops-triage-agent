id: D-0014
name: Suspicious Rundll32 no Command Line Arguments
family: endpoint
alert_type: analytic
techniques:
- T1218.011
required_roles:
- event
- host
- process
intent: Detects rundll32.exe running with no arguments (typical injection target) from process creation logs.
fp_quality: vague
explanations:
- BE-0018
- BE-0007
- BE-0008
fingerprint:
- role:host.name
- role:process.parent_name
- role:process.path
fingerprint_influence:
  role:host.name:
    rating: low
    reason: Host that reported the event.
  role:process.parent_name:
    rating: high
    reason: File name the attacker can choose.
  role:process.path:
    rating: high
    reason: Path the attacker can choose.
precedent_entity: role:host.name
flow:
- step: 1
  question: Q-0000
  bind:
    entity: role:host.name
  attacker_influence:
    rating: low
    reason: An attacker cannot freely reproduce the fingerprint's host.
  on_yes: close:inherit:precedent_match
  on_no: next
  on_unknown: next
  guards:
