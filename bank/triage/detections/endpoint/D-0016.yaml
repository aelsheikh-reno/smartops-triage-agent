id: D-0016
name: Windows Event Log Cleared
family: endpoint
alert_type: analytic
max_mode: recommend
max_mode_reason: Clears an event log, which removes evidence; a wrong close loses it for good (round 6, S5).
auto_excluded_reason: destructive_or_anti_forensic
q0_off_reason: A precedent for clearing an event log is not evidence that this clearing is benign, and the clearing destroys what an audit of the precedent would read (round 6, S5).
techniques:
- T1685.005
required_roles:
- event
- host
- user
intent: Detects the Security log (1102) or System log (104) being cleared on an endpoint from Windows event logs.
fp_quality: vague
explanations:
- BE-0013
- BE-0003
fingerprint:
- role:host.name
- role:user.name
- role:event.type_id
fingerprint_influence:
  role:host.name:
    rating: low
    reason: Host that reported the event.
  role:user.name:
    rating: low
    reason: Account recorded by the OS.
  role:event.type_id:
    rating: low
    reason: Fixed by the OS for the event type.
precedent_entity: role:host.name
flow:
- step: 1
  question: Q-0000
  bind:
    entity: role:host.name
  attacker_influence:
    rating: low
    reason: An attacker cannot freely reproduce the fingerprint's host, user, event type.
  on_yes: next
  on_no: next
  on_unknown: next
- step: 2
  question: Q-0023
  on_yes: close:benign_true_positive:host_rebuild
  on_no: next
  on_unknown: next
- step: 3
  question: Q-0004
  on_yes: flag
  flag_suggests:
    on_yes:
      suggests: close:benign_true_positive:approved_change
      reason: 'probable approved change; who-did-it (the implementer on the change) is the only hard-to-fake evidence; verify the implementer'
  on_no: escalate
  on_unknown: flag
status: draft
version: 8
derived_from:
  library: escu
  rule: escu:windows_event_log_cleared
  title: Windows Event Log Cleared
  path: detections/endpoint/windows_event_log_cleared.yml
  repo: splunk/security_content
  license: Apache-2.0
