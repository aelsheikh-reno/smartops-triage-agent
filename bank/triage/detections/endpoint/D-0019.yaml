id: D-0019
name: Windows Office Product Spawned Uncommon Process
family: endpoint
alert_type: analytic
techniques:
- T1566.001
required_roles:
- event
- host
- process
intent: Detects an Office application spawning a shell, script host or LOLBin (cmd, PowerShell, wscript, cscript, mshta, rundll32, regsvr32, certutil, bitsadmin, wmic) from process creation logs.
fp_quality: none
notes: 'fp_quality none: The source rule gives no benign cause. The tested causes (routine business macros and add-ins) come from analyst practice and need review. Command-line and registry-value baselines
  are attacker-chosen strings (attacker_influence high), so on their own they flag instead of closing.'
explanations:
- BE-0007
- BE-0008
fingerprint:
- role:host.name
- role:process.parent_name
- role:process.name
- role:process.command_line
fingerprint_influence:
  role:host.name:
    rating: low
    reason: Host that reported the event.
  role:process.parent_name:
    rating: high
    reason: File name the attacker can choose.
  role:process.name:
    rating: high
    reason: File name the attacker can choose.
  role:process.command_line:
    rating: high
    reason: Command line the attacker writes.
precedent_entity: role:host.name
flow:
- step: 1
  question: Q-0000
  bind:
    entity: role:host.name
  attacker_influence:
    rating: low
    reason: An attacker cannot freely reproduce the fingerprint's host.
  on_yes: close:inherit:precedent_match
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0045
    then: flag
    rule:
      gte:
        param: alert_history_min_count
- step: 2
  question: Q-0014
  rule:
    gte:
      param: entity_baseline_min_days
  on_yes: flag
  on_no: next
  on_unknown: next
- step: 3
  question: Q-0015
  rule:
    gte:
      param: org_prevalence_min_hosts
  on_yes: flag
  on_no: escalate
  on_unknown: flag
status: draft
version: 7
derived_from:
  library: escu
  rule: escu:windows_office_product_spawned_uncommon_process
  title: Windows Office Product Spawned Uncommon Process
  path: detections/endpoint/windows_office_product_spawned_uncommon_process.yml
