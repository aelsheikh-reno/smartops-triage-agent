id: D-0020
name: Windows Possible Credential Dumping
family: endpoint
alert_type: analytic
techniques:
- T1003.001
required_roles:
- host
- user
- process
- target_process
- process_access
- event
intent: Detects a non-SYSTEM process opening LSASS with query-limited or duplicate-handle access on an endpoint from process access events.
fp_quality: good
notes: 'The source rule''s search already drops SYSTEM and NETWORK SERVICE sources, so most EDR/AV agents never reach triage. The remaining benign cases are user-context tools. Coverage gap: SYSTEM-context
  dumping is excluded by the source rule''s search; needs a separate detection.

  '
explanations:
- BE-0004
- BE-0005
- BE-0007
fingerprint:
- role:host.name
- role:process.path
- role:process.sha256
- role:process_access.rights
fingerprint_influence:
  role:host.name:
    rating: low
    reason: Host that reported the event.
  role:process.path:
    rating: high
    reason: Path the attacker can choose.
  role:process.sha256:
    rating: low
    reason: Computed by the sensor.
  role:process_access.rights:
    rating: high
    reason: Access mask the attacker requests.
precedent_entity: role:host.name
flow:
- step: 1
  question: Q-0000
  bind:
    entity: role:host.name
  attacker_influence:
    rating: low
    reason: An attacker cannot freely reproduce the fingerprint's host, source binary hash.
  on_yes: close:inherit:precedent_match
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0045
    then: flag
    rule:
      gte:
        param: alert_history_min_count
- step: 2
  question: Q-0005
  on_yes: close:false_positive:sanctioned_lsass_accessor
  on_no: next
  on_unknown: next
- step: 3
  question: Q-0006
  on_yes: close:false_positive:known_benign_lsass_accessor
  on_no: next
  on_unknown: next
- step: 4
  question: Q-0007
  rule:
    gte:
      param: entity_baseline_min_days
  on_yes: next
  on_no: escalate
  on_unknown: flag
- step: 5
  question: Q-0011
  on_yes: close:false_positive:lsass_access_baselined
  on_no: flag
  on_unknown: flag
status: draft
version: 8
parameters:
  entity_baseline_min_days: 5
derived_from:
  library: escu
  rule: escu:windows_possible_credential_dumping
  title: Windows Possible Credential Dumping
  path: detections/endpoint/windows_possible_credential_dumping.yml
  repo: splunk/security_content
  license: Apache-2.0
