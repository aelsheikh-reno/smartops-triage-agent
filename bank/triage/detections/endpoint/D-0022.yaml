id: D-0022
name: Windows Schtasks Create Run As System
family: endpoint
alert_type: analytic
techniques:
- T1053.005
required_roles:
- event
- host
- process
- user
intent: Detects schtasks.exe /create /ru SYSTEM from process creation logs.
fp_quality: good
explanations:
- BE-0002
- BE-0008
- BE-0003
fingerprint:
- role:host.name
- role:process.parent_name
- role:process.command_line
fingerprint_influence:
  role:host.name:
    rating: low
    reason: Host that reported the event.
  role:process.parent_name:
    rating: high
    reason: File name the attacker can choose.
  role:process.command_line:
    rating: high
    reason: Command line the attacker writes.
precedent_entity: role:host.name
flow:
- step: 1
  question: Q-0000
  bind:
    entity: role:host.name
  attacker_influence:
    rating: low
    reason: An attacker cannot freely reproduce the fingerprint's host.
  on_yes: close:inherit:precedent_match
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0045
    then: flag
    rule:
      gte:
        param: alert_history_min_count
- step: 2
  question: Q-0001
  on_yes: close:benign_true_positive:sanctioned_deployment_tool
  on_no: next
  on_unknown: next
- step: 3
  question: Q-0004
  on_yes: flag
  on_no: next
  on_unknown: next
- step: 4
  question: Q-0019
  bind:
    entity: entity:parent_process
  on_yes: next
  on_no: flag
  on_unknown: flag
- step: 5
  question: Q-0015
  rule:
    gte:
      param: org_prevalence_min_hosts
  on_yes: close:benign_true_positive:prevalent_in_org
  on_no: escalate
  on_unknown: flag
status: draft
version: 8
parameters:
  precedent_validity_hours: 72
