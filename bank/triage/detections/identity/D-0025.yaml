id: D-0025
name: Detect New Local Admin account
family: identity
alert_type: analytic
techniques:
- T1136.001
required_roles:
- event
- host
- actor
- user
intent: Detects a new local account (4720) that is added to local Administrators (4732) within 180 minutes, from Windows Security logs.
fp_quality: good
explanations:
- BE-0017
- BE-0001
- BE-0003
q0_off_reason: 'Re-creating an account with the same name gives the same fingerprint for a new account, which no question here sees (aimed case, round 9).'
fingerprint:
- role:host.name
- role:actor.name
- role:user.name
fingerprint_influence:
  role:host.name:
    rating: low
    reason: Host that reported the event.
  role:actor.name:
    rating: low
    reason: Acting account recorded by the OS.
  role:user.name:
    rating: low
    reason: Account recorded by the OS.
precedent_entity: role:host.name
flow:
- step: 1
  question: Q-0000
  bind:
    entity: role:host.name
  attacker_influence:
    rating: low
    reason: An attacker cannot freely reproduce the fingerprint's host, acting account, user.
  on_yes: next
  on_no: next
  on_unknown: next
- step: 2
  question: Q-0020
  on_yes: flag
  flag_suggests:
    on_yes:
      suggests: close:benign_true_positive:provisioning_service_account
      reason: 'probable provisioning; who-did-it (the provisioning service account) is the only hard-to-fake evidence; verify the provisioning request'
  on_no: next
  on_unknown: next
- step: 3
  question: Q-0002
  bind:
    user: role:actor.name
  on_yes: next
  on_no: escalate
  on_unknown: flag
- step: 4
  question: Q-0004
  bind:
    user: role:actor.name
  on_yes: flag
  flag_suggests:
    on_yes:
      suggests: close:benign_true_positive:approved_change
      reason: 'probable approved change; who-did-it (the implementer on the change) is the only hard-to-fake evidence; verify the implementer'
  on_no: escalate
  on_unknown: flag
status: draft
version: 8
parameters:
  precedent_validity_hours: 72
derived_from:
  library: escu
  rule: escu:detect_new_local_admin_account
  title: Detect New Local Admin account
  path: detections/endpoint/detect_new_local_admin_account.yml
  repo: splunk/security_content
  license: Apache-2.0
