id: D-0027
name: Firewall deny or port-scan alert
family: network
alert_type: control
techniques:
- T1046
- T1595.001
required_roles:
- src
- dest
- network
- reporting_control
- event
intent: 'Generic: a firewall reports denied connections or a scan pattern from a source (normalized network-traffic alert, any product).'
fp_quality: generic
explanations:
- BE-0003
- BE-0021
- BE-0028
- BE-0030
- BE-0033
- BE-0037
fingerprint:
- role:src.ip
- role:dest.ip
- role:dest.port
- role:network.rule
notes: 'Internal sources never close on denied traffic; they flag. The denied check covers every connection from the source, to any destination. An approved scanner closes only while a scan job targeting
  the destination was running; an approved tester only under a covering change or engagement record. Allowed connections elsewhere from the source flag rather than escalate: they show the source is not
  only probing, not that the denied connection got through.'
precedent_entity: role:src.ip
fingerprint_influence:
  role:src.ip:
    rating: medium
    reason: 'Spoofable in denied traffic: no handshake completes.'
  role:dest.ip:
    rating: high
    reason: Target chosen by the initiator.
  role:dest.port:
    rating: high
    reason: Chosen by the initiator.
  role:network.rule:
    rating: high
    reason: Selected by the firewall from the initiator's traffic.
flow:
- step: 1
  question: Q-0000
  bind:
    entity: role:src.ip
    current_action: role:reporting_control.action
  attacker_influence:
    rating: medium
    reason: The least attacker-chosen fingerprint field (the source address) can still be forged; the close also needs a low-rated yes from a guard.
  on_yes: close:inherit:precedent_match
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0045
    then: flag
    rule:
      gte:
        param: alert_history_min_count
  - question: Q-0050
    then: flag
  - question: Q-0042
    when:
    - 'no'
    then: flag
- step: 2
  question: Q-0031
  on_yes: flag
  flag_suggests:
    on_yes:
      suggests: close:benign_true_positive:approved_scanner_activity
      reason: 'probable approved scan; a compromised scanner during its scan job is the same traffic; verify the scan job and the targets'
  on_no: next
  on_unknown: next
- step: 3
  question: Q-0056
  on_yes: close:benign_true_positive:approved_infrastructure
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0042
    when:
    - 'no'
    then: flag
  - question: Q-0046
    then: flag
    bind:
      key: role:src.ip
    rule:
      gte:
        param: alert_history_min_count
- step: 4
  question: Q-0055
  on_yes: flag
  flag_suggests:
    on_yes:
      suggests: close:benign_true_positive:approved_change
      reason: 'probable approved change or test; the change record naming the source is the only hard-to-fake evidence; verify the implementer or tester owns this traffic'
  on_no: next
  on_unknown: next
- step: 5
  question: Q-0042
  on_yes: flag
  flag_suggests:
    on_yes:
      suggests: close:mitigated_true_positive:denied_no_successful_connection
      reason: 'probably stopped; every logged connection from the source was denied, but traffic on an unlogged path is not visible here; confirm the source reached nothing'
  on_no: flag
  on_unknown: flag
  guards:
  - question: Q-0032
    then: escalate
    applies_to: [flag]
status: draft
version: 6
derived_from:
  library: bank
  rule: vendor:firewall_deny
  title: Firewall deny or port-scan alert
  path: bank/intake/use_cases.yaml#UC-003
  repo: internal
  license: internal
