id: Q-0000
text: 'Is there a qualifying precedent for this fingerprint: an audited close, or (outside Auto) at least the customer''s minimum number of independent human closes, inside the validity window, with
  the precedent entity not a crown jewel, no other alert on it of higher severity than this one, and no other detection on it in the grouping window (a mitigated precedent only when this alert was
  also stopped)?'
tests: BE-0000
attacker_influence:
  rating: low
  reason: Default only; each detection rates Q0 from its fingerprint fields (step-level attacker_influence).
notes: 'A closure with reason precedent_match is never itself a precedent; precedents cannot chain. In Shadow and Recommend the precedent is shown to the analyst instead of closing. Validity window is set
  per detection (precedent_validity).

  '
