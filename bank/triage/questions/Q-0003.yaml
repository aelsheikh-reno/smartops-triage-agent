id: Q-0003
text: Has this user run this same binary (same hash, or same signer and path) on this host on at least the customer's minimum number of distinct days in the lookback before the alert window?
tests: BE-0007
attacker_influence:
  rating: high
  reason: An attacker who already runs code as this user can build the history by running the same binary on several days; baselines default to high (capability-spec).
  changed_in_migration: low -> high
derived_from:
  source:
  - elastic/detection-rules rules/windows/execution_psexec_lateral_movement_command.toml
  license:
  - Elastic-2.0
text_origin: original
legal_review: false
status: draft
version: 4
kind: triage
inputs:
  entity:
  - role:user.name
  - role:host.name
  behavior: ran the binary of entity:process
  lookback_days:
    param: entity_baseline_lookback_days
