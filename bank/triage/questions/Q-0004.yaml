id: Q-0004
text: Does an approved change cover this host at the alert time and list the alert's user, or a group they belong to, as an implementer?
tests: BE-0003
attacker_influence:
  rating: low
  reason: Approved change records the activity cannot touch; a yes needs an approver who is not an implementer, so a self-approved change cannot carry a close.
  changed_in_migration: none -> low
notes: A covering change without implementer data answers unknown (no_data), never yes.
