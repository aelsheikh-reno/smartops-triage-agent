id: Q-0036
text: Do click and open records show that no recipient followed a link or opened an attachment from the message (unknown when it carried an attachment and attachment opens are not recorded on every recipient's host, or a link and link clicks are not recorded for every recipient)?
tests: BE-0024
attacker_influence:
  rating: medium
  reason: Click and open records come from the mail platform; clicks outside its rewriting (copied links, other devices) and attachments opened from a local copy are missed, so an absence of records is not evidence on its own (round 6, B2; links, #29).
