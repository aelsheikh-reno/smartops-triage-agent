id: T1136.001
name: Local Account
attack_version: '20.0'
required_roles:
- host
- user
- actor
- event
template: account
covers: Local account creation
max_mode: recommend
max_mode_reason: technique fallback with no true-positive replay data (#14); capped at Recommend until it has some
fingerprint:
- role:host.name
- role:user.name
fingerprint_influence:
  role:host.name:
    rating: low
    reason: Host that reported the event.
  role:user.name:
    rating: low
    reason: Account recorded by the OS.
precedent_entity: role:host.name
flow:
- step: 1
  question: Q-0000
  bind:
    entity: role:host.name
  attacker_influence:
    rating: low
    reason: An attacker cannot freely reproduce the fingerprint's host, user.
  on_yes: close:inherit:precedent_match
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0045
    then: flag
    rule:
      gte:
        param: alert_history_min_count
- step: 2
  question: Q-0020
  on_yes: close:benign_true_positive:provisioning_service_account
  on_no: next
  on_unknown: next
- step: 3
  question: Q-0002
  bind:
    user: role:actor.name
  on_yes: next
  on_no: escalate
  on_unknown: flag
- step: 4
  question: Q-0004
  bind:
    user: role:actor.name
  on_yes: close:benign_true_positive:approved_change
  on_no: escalate
  on_unknown: flag
derived_from:
  source: MITRE ATT&CK v20.0 (mitre-attack/attack-stix-data); flow assembled from the pilot rule-level flows
  license: MITRE ATT&CK Terms of Use
status: draft
version: 4
