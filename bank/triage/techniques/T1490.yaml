id: T1490
name: Inhibit System Recovery
attack_version: '20.0'
required_roles:
- host
- user
- process
- event
template: shadow_copy
covers: Shadow copy manipulation
max_mode: recommend
max_mode_reason: technique fallback with no true-positive replay data (#14); capped at Recommend until it has some
fingerprint:
- role:host.name
- role:user.name
- role:process.sha256
- role:process.parent_name
fingerprint_influence:
  role:host.name:
    rating: low
    reason: Host that reported the event.
  role:user.name:
    rating: low
    reason: Account recorded by the OS.
  role:process.sha256:
    rating: low
    reason: Computed by the sensor; reproducing it means running the same binary.
  role:process.parent_name:
    rating: high
    reason: File name the attacker can choose.
precedent_entity: role:host.name
flow:
- step: 1
  question: Q-0000
  bind:
    entity: role:host.name
  attacker_influence:
    rating: low
    reason: An attacker cannot freely reproduce the fingerprint's host, user, process hash.
  on_yes: close:inherit:precedent_match
  on_no: next
  on_unknown: next
  guards:
  - question: Q-0045
    then: flag
    rule:
      gte:
        param: alert_history_min_count
- step: 2
  question: Q-0021
  on_yes: close:benign_true_positive:sanctioned_backup_tool
  on_no: next
  on_unknown: next
- step: 3
  question: Q-0004
  on_yes: close:benign_true_positive:approved_change
  on_no: escalate
  on_unknown: escalate
derived_from:
  source: MITRE ATT&CK v20.0 (mitre-attack/attack-stix-data); flow assembled from the pilot rule-level flows
  license: MITRE ATT&CK Terms of Use
status: draft
version: 3
