# Use-case catalog: what customers choose from, in their language.
# rank and volume_reason are estimates of relative alert volume in a typical GCC bank or telecom SOC,
# from practitioner experience, not measured data. Replace with the customer's own alert counts at onboarding.
# linked lists are generated from the cloned sources (ESCU production rules, Azure-Sentinel solutions,
# SigmaHQ rules/) by name and story matching; 'shown' is capped at 8, 'total' counts all matches.
# Matches are leads for batch selection, not curated mappings.
# coverage: rule-level-full = every linked detection has a bank flow; rule-level-partial = some do;
#   technique-only = none do, but a technique has a bank fallback; none = neither;
#   generic = a vendor-alert family covered only by the bank's generic vendor: detections (product-specific rules are leads, not gaps).
# covered_detections = linked detections with a bank flow; linked_detections = all linked leads (all sources, not only 'shown').
