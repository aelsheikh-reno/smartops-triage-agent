note: 'Attack-corpus plan for the Reno lab (round 9). For every detection: the ATT&CK techniques (ATT&CK v20 IDs, as in the bank), the Atomic Red Team tests that should fire it, public datasets with their
  licence, the data it needs, and whether the lab can produce it today. docs/testing/attack-corpus-plan.md is rendered from this file. Raw lab logs and samples are never committed.'
sources:
  atomic-red-team:
    repo: redcanaryco/atomic-red-team
    commit: 388942adbd9641f4dfdcf079d7efe9a75ec0ac43
    license: MIT
  splunk/attack_data:
    license: Apache-2.0
    pinned_in: tests/replay/sources.lock
  OTRF/Security-Datasets:
    repo: OTRF/Security-Datasets
    license: MIT
  sbousseaden/EVTX-ATTACK-SAMPLES:
    repo: sbousseaden/EVTX-ATTACK-SAMPLES
    license: GPL-3.0
    note: copyleft; legal review before use
lab:
  has:
  - Splunk ES
  - Sysmon and Windows event logs through the universal forwarder
  - FortiGate (traffic, IPS, web filter)
  - Atomic Red Team
  - Cribl (replays samples)
  - Windows Defender Antivirus on the Windows hosts (built in)
  lacks:
  - EDR
  - email gateway
  - DLP product
  - WAF
  status_values:
    now: the lab can produce real alerts today
    now_custom: the lab can produce it today with a lab script (no Atomic Red Team test fits)
    now_if_domain: the lab can produce it once it has a domain controller
    now_if_office: the lab can produce it once a host has Office with macros allowed
    partial_no_edr: part of the data today; the EDR side is blocked by the missing EDR
    blocked_no_edr: blocked by the missing EDR; Cribl-synthesised vendor alerts until then
    blocked_no_email_gateway: blocked by the missing email gateway; Cribl-synthesised vendor alerts until then
    cribl_synth: no product in the lab; Cribl-synthesised vendor alerts
data_needed_values:
  sysmon: Sysmon (process creation with command line, registry, process access, driver load)
  windows_security: Windows Security log
  windows_system: Windows System log
  powershell_script_block: PowerShell script-block log
  fortigate_traffic: FortiGate traffic log
  fortigate_ips: FortiGate IPS log
  fortigate_web_filter: FortiGate web-filter log
  edr_alert: EDR alert and its API
  windows_defender_av_events: Windows Defender Antivirus event log
  email_gateway: email gateway alert
  dlp: DLP alert
  device_control: device-control alert
  waf: WAF alert
lab_case_format:
  where: tests/corpus/cases/<D-ID>/<lab run ID>.yaml (one normalized alert per file, after anonymisation)
  required:
  - detection
  - source
  - lab_run_id
  - anonymisation_done
  - license
  - alert
  - expect
  fields:
    detection: D-ID
    source: lab (a Reno lab run), cribl_synth (a Cribl-synthesised vendor alert, with the sample it was built from), or a public dataset (repo and path)
    lab_run_id: 'the lab run that produced it: date, lab host set and Atomic Red Team test GUID (for example 2026-11-02-lab1-873106b7)'
    anonymisation_done: true only after host names, user names, IP addresses, domains and any customer-like data are replaced with neutral values; the method used goes in anonymisation_method
    anonymisation_method: how it was anonymised (for example the lab's fixed replacement table)
    license: 'the licence the case is under: internal for lab runs, the dataset''s licence for public samples'
    alert: the normalized alert the normalizer produced (roles only, no raw vendor event)
    expect: outcome, at least flag (a true positive never closes)
  never_committed: raw lab logs, packet captures, EVTX files, malware or driver samples and Cribl source samples; only the anonymised normalized case is committed (tests/corpus/.gitignore keeps raw/ and
    samples/ out)
