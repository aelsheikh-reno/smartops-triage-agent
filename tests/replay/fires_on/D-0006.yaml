detection: D-0006
source_rule: escu:detect_psexec_with_accepteula_flag
note: When this event would fire the source rule, on the harness's normalised event fields (tests/replay/datasets.py). Test data, not bank content.
fires_when:
  all:
  - any:
    - field: process_name
      op: in
      value:
      - psexec.exe
      - psexec64.exe
    - field: original_file_name
      op: in
      value:
      - psexec.c
  - field: process
    op: matches
    value: accepteula
