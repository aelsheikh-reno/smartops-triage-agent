detection: D-0017
source_rule: escu:windows_file_download_via_certutil
note: When this event would fire the source rule, on the harness's normalised event fields (tests/replay/datasets.py). Test data, not bank content.
fires_when:
  all:
  - field: process_name
    op: in
    value:
    - certutil.exe
  - any:
    - field: process
      op: matches
      value: '[-/]url '
    - all:
      - field: process
        op: matches
        value: urlcache|verifyctl
      - field: process
        op: matches
        value: '[-/]f '
