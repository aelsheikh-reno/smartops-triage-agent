detection: D-0021
source_rule: escu:windows_remote_services_rdp_enable
note: When this event would fire the source rule, on the harness's normalised event fields (tests/replay/datasets.py). Test data, not bank content.
fires_when:
  all:
  - field: registry_path
    op: endswith
    value: fdenytsconnections
  - field: registry_value_data
    op: matches
    value: '0x00000000'
